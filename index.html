<style>
/* Layout : bandeau d'en-tête encre (sceau CSC), onglets Cibles / Tableau de bord, liste dense + fiche cible en panneau latéral. */
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --surface-2:#EFEEEB; --line:#E0DDD7; --fg:#1E1B18; --muted:#69625B;
  --accent:#A35C2A; --accent-ink:#FFFFFF; --accent-soft:#F5E7DB;
  --ink:#1B1512; --copper:#C9804F; --parch:#EAD9B8;
  --ok:#2E7A45; --ok-soft:#E2F0E6; --warn:#9A6200; --warn-soft:#FBEED3; --bad:#B0442D; --bad-soft:#F7E1DA;
  --info:#2A66A8; --info-soft:#E0EAF6; --grey:#6E6862; --grey-soft:#ECEAE6;
  --opp-open:#3A8FD9; --opp-won:#5E9B2A; --opp-lost:#D9733A;
  --shadow:0 12px 40px rgba(27,21,18,.18);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13110F; --surface:#1B1815; --surface-2:#24201C; --line:#36302A; --fg:#EEE9E3; --muted:#A49B91;
  --accent:#DC955F; --accent-ink:#1B1512; --accent-soft:#3A2A1E;
  --ok:#6CC08A; --ok-soft:#1D3325; --warn:#E3AA45; --warn-soft:#382C14; --bad:#E8886F; --bad-soft:#3D221B;
  --info:#7DB2EA; --info-soft:#1B2A3B; --grey:#A49B91; --grey-soft:#2A2622;
  --opp-open:#5BA6E6; --opp-won:#86C24F; --opp-lost:#E8915E; --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13110F; --surface:#1B1815; --surface-2:#24201C; --line:#36302A; --fg:#EEE9E3; --muted:#A49B91;
  --accent:#DC955F; --accent-ink:#1B1512; --accent-soft:#3A2A1E;
  --ok:#6CC08A; --ok-soft:#1D3325; --warn:#E3AA45; --warn-soft:#382C14; --bad:#E8886F; --bad-soft:#3D221B;
  --info:#7DB2EA; --info-soft:#1B2A3B; --grey:#A49B91; --grey-soft:#2A2622;
  --opp-open:#5BA6E6; --opp-won:#86C24F; --opp-lost:#E8915E; --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
.exout{width:100%;min-height:160px;font:12px/1.4 var(--f-num);white-space:pre}
.notice a{color:var(--accent);font-weight:600}
body{background:var(--bg);color:var(--fg);font:400 14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* En-tête */
.top{background:var(--ink);color:var(--parch)}
.top-in{max-width:1240px;margin:0 auto;padding:14px 20px 0;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{margin:0;font:600 19px/1.15 var(--f-label);letter-spacing:.01em;color:#F3E9D6}
.brand p{margin:2px 0 0;font-size:12.5px;color:#BFAE92}
.brand .grow{flex:1;min-width:0}
.sync{font:500 11.5px var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:#BFAE92;display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:#7E705D;display:inline-block}
.sync[data-s="db"] i,.sync[data-s="local"] i{background:#86C24F}.sync[data-s="warn"] i{background:#E3AA45}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;padding:10px 14px 11px;color:#BFAE92;font:600 13px var(--f-label);letter-spacing:.05em;text-transform:uppercase;border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:#F3E9D6;border-bottom-color:var(--copper)}
.tab:hover{color:#F3E9D6}

main{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:20px 60px;display:flex;flex-direction:column;gap:16px}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--muted)}
.notice b{color:var(--fg)}
.notice.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--fg)}

/* Barre d'outils */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar .grow{flex:1}
.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.chip .n{font:500 11.5px var(--f-num);color:var(--muted);background:var(--surface-2);border-radius:999px;padding:0 6px}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip[aria-pressed="true"] .n{background:rgba(127,127,127,.3);color:inherit}

.filters{display:grid;grid-template-columns:minmax(0,1.8fr) repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:1100px){.filters{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.filters .field-s:first-child{grid-column:1/-1}}
.field-s{display:flex;flex-direction:column;gap:3px;min-width:0}
.field-s label,.lbl{font:600 11px var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=email],input[type=tel],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
textarea{resize:vertical;min-height:70px}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}

/* Liste */
.list-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:860px}
th{font:600 11px var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.co{font-weight:600}
.co .ex{font:600 10px var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.sub{color:var(--muted);font-size:12.5px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font:500 11px var(--f-num);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted);white-space:nowrap}
.tag.bu{font-family:var(--f-label);font-size:11.5px;color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font:500 12px var(--f-label);letter-spacing:.02em;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-a_qualifier{background:var(--grey-soft);color:var(--grey)}
.st-cible{background:var(--info-soft);color:var(--info)}
.st-rdv{background:var(--warn-soft);color:var(--warn)}
.st-visite{background:var(--accent-soft);color:var(--accent)}
.st-opportunite{background:var(--info-soft);color:var(--info)}
.st-gagne{background:var(--ok-soft);color:var(--ok)}
.st-sans_suite{background:var(--bad-soft);color:var(--bad)}
.prio{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:5px;font:600 13px var(--f-label)}
.prio-A{background:var(--accent);color:var(--accent-ink)}
.prio-B{background:var(--accent-soft);color:var(--accent)}
.prio-C{background:var(--surface-2);color:var(--muted)}
.late{color:var(--bad);font-weight:600}
.ty{font:600 10.5px var(--f-label);letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:1px 5px;margin-right:4px;background:var(--surface-2);color:var(--muted)}
.ty-pres{background:var(--info-soft);color:var(--info)}.ty-clie{background:var(--ok-soft);color:var(--ok)}
.imp-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.imp-sum div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.imp-sum b{display:block;font:500 20px var(--f-num)}
.imp-prev{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.imp-prev table{min-width:520px}.imp-prev td,.imp-prev th{padding:6px 8px;font-size:12.5px}
.nearl{display:flex;flex-direction:column;gap:8px;border:1px solid var(--info);background:var(--info-soft);border-radius:6px;padding:10px 12px}
.nearl .hint{margin:-4px 0 2px}
.near-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
@media (max-width:520px){.near-r{grid-template-columns:minmax(0,1fr)}}
.radio{display:flex;flex-direction:column;gap:6px}.radio label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}.radio input{accent-color:var(--accent);margin-top:3px}
.empty{padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.empty h3{margin:0;color:var(--fg);font:600 16px var(--f-label)}
.empty p{margin:0;max-width:52ch}

/* Tableau de bord */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font:500 26px/1.1 var(--f-num);font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--muted)}
.meter{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.meter b{display:block;height:100%;background:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{margin:0;font:600 13px var(--f-label);letter-spacing:.06em;text-transform:uppercase}
.panel .cap{font-size:12.5px;color:var(--muted);margin:-6px 0 0}
.panel svg{width:100%;height:auto;display:block}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:13px}
.hbar .t{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.hbar .t b{display:block;height:100%;border-radius:3px}
.hbars{display:flex;flex-direction:column;gap:7px}
.ratio{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:8px;font-size:13px}
.ratio:first-of-type{border-top:0;padding-top:0}
.obj{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.obj input{width:70px}

/* Panneau fiche */
.scrim{position:fixed;inset:0;background:rgba(15,12,10,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{display:flex;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.dh h2{margin:0;font:600 18px/1.2 var(--f-label);text-wrap:balance}
.dh .grow{flex:1;min-width:0}
.db{flex:1;overflow-y:auto;padding:16px 18px 24px;display:flex;flex-direction:column;gap:18px}
.df{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface)}
.df .grow{flex:1}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font:600 12px var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:0;margin-bottom:10px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.req{color:var(--bad)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 9px;cursor:pointer;font-size:13px}
.checks input{accent-color:var(--accent);margin:0}
.checks label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:max-content}
.seg button{border:0;background:var(--surface);padding:6px 14px;cursor:pointer;font:600 13px var(--f-label);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.steps{display:flex;flex-wrap:wrap;gap:4px}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font:500 12.5px var(--f-label);cursor:pointer;color:var(--muted)}
.steps button.done{color:var(--fg);border-color:var(--muted)}
.steps button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.visit{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.visit .vh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.visit .vh .grow{flex:1}
.visit p{margin:0;white-space:pre-wrap;font-size:13.5px}
.vs-Planifiée{background:var(--warn-soft);color:var(--warn)}
.vs-Réalisée{background:var(--ok-soft);color:var(--ok)}
.vs-Annulée{background:var(--grey-soft);color:var(--grey)}
.addv{border:1px dashed var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px}
/* Fiche cible élargie : deux colonnes, suivi des échanges à droite */
.drawer.wide{width:min(1240px,100%)}
.fgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;align-items:start}
.fcol{display:flex;flex-direction:column;gap:22px;min-width:0}
@media (max-width:980px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.ech{display:flex;flex-direction:column;gap:10px;min-width:0}
.ech-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.ech-h .leg{font:600 12px var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.echips .chip{padding:3px 9px;font-size:12.5px}
.eform{background:var(--surface);border-style:solid}
.elist{display:flex;flex-direction:column;gap:8px}
.ecard{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.eh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.eh .grow{flex:1;min-width:0}
.eic{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-2);color:var(--muted);flex:none}
.eic svg{width:13px;height:13px}
.eic-appel{background:var(--info-soft);color:var(--info)}.eic-mail{background:var(--accent-soft);color:var(--accent)}.eic-visite,.eic-visio{background:var(--ok-soft);color:var(--ok)}
.eobj{font-weight:600;overflow-wrap:anywhere}
.edet{margin:0;white-space:pre-wrap;font-size:13.5px;overflow-wrap:anywhere}
.tone-ok{background:var(--ok-soft);color:var(--ok)}.tone-bad{background:var(--bad-soft);color:var(--bad)}.tone-warn{background:var(--warn-soft);color:var(--warn)}.tone-info{background:var(--info-soft);color:var(--info)}.tone-grey{background:var(--grey-soft);color:var(--grey)}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.nudge{animation:nudge .25s 2}
/* Mailing */
.mtab{min-width:1080px}
.mtab tbody tr{cursor:default}
.mtab tbody tr:hover td{background:none}
.mtab td{vertical-align:middle;padding:8px 10px}
.mtab tr.msent td:first-child{background:var(--ok-soft)}
.mtab input[type=date]{width:142px;padding:5px 7px}
.mtab input[type=text]{min-width:210px;padding:5px 8px}
.mck{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font:600 12px var(--f-label);letter-spacing:.02em;white-space:nowrap;color:var(--muted)}
.mck input{width:18px;height:18px;accent-color:var(--ok);margin:0;cursor:pointer}
.msent .mck{color:var(--ok)}
.mflag{display:inline-block;margin-top:4px;font-size:11.5px;line-height:1.35;color:var(--grey);background:var(--grey-soft);border-radius:4px;padding:1px 6px;max-width:320px}
.mflag.warn{color:var(--warn);background:var(--warn-soft)}
.mtab input.mlate{border-color:var(--bad);color:var(--bad);font-weight:600}
.mact{white-space:nowrap;text-align:right}.mact .btn{padding:5px 9px;margin-left:4px}
.mtab .dl{font-size:12.5px;overflow-wrap:anywhere}
.mlink{background:none;border:0;padding:0;font:600 14px var(--f-ui);color:var(--fg);cursor:pointer;text-align:left}
.mlink:hover{color:var(--accent);text-decoration:underline}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}

.cal-d{background:var(--surface);min-height:170px;padding:6px 6px 8px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0;position:relative}
.cal-d:hover{background:color-mix(in srgb,var(--surface) 92%,var(--accent))}
.cal-d.we{background:var(--surface-2)}
.cal-d.out .dn{opacity:.45}
.cal-m .cal-d{min-height:112px}
.dn{display:flex;align-items:center;gap:6px;font:600 12px var(--f-label);color:var(--muted)}
.dn b{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:50%;font:600 12.5px var(--f-num);color:var(--fg)}
.cal-d.today .dn b{background:var(--accent);color:var(--accent-ink)}
.cal-d .add{position:absolute;top:5px;right:6px;opacity:0;font:600 15px var(--f-ui);color:var(--accent);line-height:1}
.cal-d:hover .add{opacity:1}
.ev{display:block;width:100%;text-align:left;font:500 12px/1.3 var(--f-ui);color:var(--fg);border:0;border-radius:4px;padding:3px 6px 3px 7px;background:var(--surface-2);box-shadow:inset 3px 0 0 var(--grey);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-w .ev{white-space:normal}
.ev .t{font:500 11px var(--f-num);color:var(--muted);margin-right:4px}
.ev .k{display:block;font-size:11.5px;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev:hover{filter:brightness(.97);outline:1px solid var(--line)}
.ev.k-visite,.ev.k-visio{background:var(--ok-soft);box-shadow:inset 3px 0 0 var(--ok)}
.ev.k-appel{background:var(--info-soft);box-shadow:inset 3px 0 0 var(--info)}
.ev.k-mail{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.ev.k-tache{background:var(--warn-soft);box-shadow:inset 3px 0 0 var(--warn)}
.ev.k-evenement{background:var(--grey-soft);box-shadow:inset 3px 0 0 var(--fg)}
.ev.k-rel{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.ev.done{opacity:.6}.ev.done .o{text-decoration:line-through}
.ev.late{box-shadow:inset 3px 0 0 var(--bad)}
.cal .nmore{font:500 11.5px var(--f-ui);color:var(--muted);padding:0 4px}
.cal-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.cal-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
@media (max-width:760px){.cal-w{grid-template-columns:minmax(0,1fr)}.cal-w .hd{display:none}.cal-w .cal-d{min-height:0}.cal-m .cal-d{min-height:64px}.cal-m .ev{font-size:0;padding:0;height:6px}.cal-m .ev *{display:none}}
/* Listes « à faire » */
.todo{display:flex;flex-direction:column}
.todo-g{display:flex;align-items:center;gap:8px;font:600 11px var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:12px 2px 5px}
.todo-g:first-child{padding-top:2px}
.todo-g .n{font:500 11px var(--f-num);background:var(--surface-2);border-radius:999px;padding:0 7px;color:var(--muted)}
.todo-g.bad{color:var(--bad)}.todo-g.bad .n{background:var(--bad-soft);color:var(--bad)}
.todo-g.acc{color:var(--accent)}
.ti{display:grid;grid-template-columns:22px 26px minmax(0,1fr) auto;gap:8px;align-items:start;padding:8px 4px;border-top:1px solid var(--line);cursor:pointer;border-radius:4px}
.ti:hover{background:var(--surface-2)}
.ti .o{font-weight:500;overflow-wrap:anywhere;line-height:1.35}
.ti .m{font-size:12.5px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
.ti .m .lk{color:var(--fg);font-weight:500}
.ti .dt{font:500 12px var(--f-num);color:var(--muted);white-space:nowrap;text-align:right;padding-top:2px}
.ti .dt.late{color:var(--bad);font-weight:600}
.ti.done .o{color:var(--muted)}
.ck{width:19px;height:19px;border:1.6px solid var(--muted);border-radius:5px;background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0;margin-top:2px;color:#fff}
.ck svg{width:12px;height:12px}
.ck:hover{border-color:var(--ok);background:var(--ok-soft)}
.ck.on{background:var(--ok);border-color:var(--ok)}
.ti .eic{margin-top:-1px}
.eic-tache{background:var(--warn-soft);color:var(--warn)}.eic-note{background:var(--grey-soft);color:var(--fg)}.eic-rel{background:var(--accent-soft);color:var(--accent)}.eic-evenement{background:var(--grey-soft);color:var(--fg)}
.empty-s{padding:14px 4px;color:var(--muted);font-size:13px}
/* Listes génériques */
.mini{display:flex;flex-direction:column}
.mini .mi{display:flex;align-items:center;gap:8px;padding:8px 2px;border-top:1px solid var(--line);font-size:13.5px}
.mini .mi:first-child{border-top:0}
.mini .mi .grow{flex:1;min-width:0}
.mini .mi .sub{font-size:12px}
.panel .btn svg{width:15px;height:15px;display:inline-block}
.qa{display:flex;flex-wrap:wrap;gap:6px}
.qa .btn{padding:5px 10px;font-size:13px}
.qa .btn svg{width:14px;height:14px}
/* Tableaux V3 */
.tbl{width:100%;border-collapse:collapse;min-width:900px}
.tbl td{vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl .co{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tbl .muted{color:var(--muted)}
.stp{display:flex;flex-wrap:wrap;gap:4px}
.stp .pill{font-size:11.5px;padding:1px 7px}
.nx{display:flex;flex-direction:column;gap:1px;min-width:0}
.nx .d{font:500 12.5px var(--f-num)}
.nx .d.late{color:var(--bad);font-weight:600}
.nx .l{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ty-pros{background:var(--warn-soft);color:var(--warn)}
.pager{display:flex;align-items:center;gap:10px}
/* Fiche compte */
.acc-h{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.acc-top{display:flex;gap:14px 18px;align-items:flex-start;flex-wrap:wrap}
.acc-top .grow{flex:1;min-width:260px}
.acc-top h2{margin:2px 0 6px;font:600 26px/1.15 var(--f-label)}
.acc-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.acc-tags .ty{margin:0}
.acc-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.acc-stats div{background:var(--surface-2);padding:9px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.acc-stats b{font:500 17px var(--f-num)}
.acc-stats span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-stats .late{color:var(--bad)}
@media (max-width:900px){.acc-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.acc-grid{display:grid;grid-template-columns:minmax(270px,330px) minmax(0,1fr) minmax(300px,390px);gap:16px;align-items:start}
.acc-grid>div{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:1380px){.acc-grid{grid-template-columns:minmax(260px,320px) minmax(0,1fr)}.acc-grid>.c3{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.acc-grid,.acc-grid>.c3{grid-template-columns:minmax(0,1fr)}}
.kvl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 12px;font-size:13.5px;margin:0}
.kvl dt{color:var(--muted);font-size:12.5px;padding-top:1px}
.kvl dd{margin:0;overflow-wrap:anywhere}
.ccard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;background:var(--surface);position:relative}
.ccard .nm{font-weight:600;display:flex;align-items:center;gap:6px;padding-right:56px}
.ccard .nm .star{color:var(--copper);font-size:12px}
.ccard .ed{position:absolute;top:6px;right:6px;padding:3px 8px;font-size:12px}
.cards{display:flex;flex-direction:column;gap:8px}
.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer;border-radius:4px}
.tl-i:first-child{border-top:0}
.tl-i:hover{background:var(--surface-2)}
.tl-i .eh{gap:6px 8px}
.tl-i .edet{color:var(--fg)}
.tl-i.annule{opacity:.6}
.cibc{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:var(--surface)}
.cibc:hover{border-color:var(--muted)}
.cibc .ctop{display:flex;align-items:center;gap:8px}
.cibc .ctop .grow{flex:1;min-width:0;font-weight:600;font-size:13.5px}
.mlc{border-top:1px solid var(--line);padding:8px 2px;display:flex;flex-direction:column;gap:2px;font-size:13px;cursor:pointer}
.mlc:first-child{border-top:0}
.mlc:hover{background:var(--surface-2)}
/* Fenêtre modale (action, contact, compte) */
.mscrim{position:fixed;inset:0;background:rgba(15,12,10,.5);z-index:30}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(720px,calc(100% - 24px));max-height:calc(100% - 32px);background:var(--bg);border-radius:12px;z-index:31;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.modal .db{padding:16px 18px 20px;gap:14px}
.tpick{display:flex;flex-wrap:wrap;gap:6px}
.tpick button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font:500 13px var(--f-ui);cursor:pointer;color:var(--muted)}
.tpick button svg{width:14px;height:14px}
.tpick button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.suite{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.row4{grid-template-columns:repeat(2,minmax(0,1fr))}}
input[type=time]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
/* Campagnes (cibles) */
.camps{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.camp{min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.camp:hover{border-color:var(--muted)}
.camp[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.camp b{font:600 13px var(--f-label)}
.camp .cs{display:flex;flex-wrap:wrap;gap:2px 10px;font:500 11.5px var(--f-num);color:var(--muted)}.camp .cs span{white-space:nowrap}
.camp .bar5{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--surface-2)}
.camp .bar5 i{display:block;height:100%}
/* Plans du PAC */
.plans{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.plan{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font:600 13px var(--f-label);cursor:pointer;color:var(--fg)}
.plan .ax{font:500 11px var(--f-ui);color:var(--muted)}
.plan .n{font:500 11px var(--f-num);background:var(--surface-2);border-radius:999px;padding:0 6px;color:var(--muted)}
.plan[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#F3E9D6}
.plan[aria-pressed="true"] .ax{color:#BFAE92}.plan[aria-pressed="true"] .n{background:#3A302A;color:#E8DCC6}
.pl-l{display:flex;flex-direction:column}
.pl-l .pi{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 2px;border-top:1px solid var(--line);font-size:13.5px;cursor:pointer}
.pl-l .pi:first-child{border-top:0}
.pl-l .pi:hover{background:var(--surface-2)}
.pl-l .prio{width:30px;font-size:12px}
.dpill{font:500 11.5px var(--f-label);border-radius:4px;padding:1px 7px;white-space:nowrap}
.d-Continuer{background:var(--ok-soft);color:var(--ok)}.d-Modifier{background:var(--warn-soft);color:var(--warn)}.d-Reporter{background:var(--info-soft);color:var(--info)}.d-Arrêter{background:var(--bad-soft);color:var(--bad)}.d-none{background:var(--surface-2);color:var(--muted)}
/* Petits écrans : la barre latérale passe en haut */
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;gap:8px;padding:8px 10px;overflow-x:auto;overflow-y:hidden}
  .side .brand{border:0;margin:0;padding:0}
  .side .brand .grow,.nav-g,.side-f .sync,.side-f .ver{display:none}
  .qk{display:flex;gap:2px;padding:0;border-left:1px solid #3A302A;padding-left:6px}
  .qk button{padding:6px;background:none;border-color:transparent}
  .qk button span{display:none}
  .nav{flex-direction:row;gap:2px}
  .nav button{padding:7px 9px}
  .nav button span.l{display:none}
  .nav button[aria-current="page"] span.l{display:inline}
  .side-f{margin:0 0 0 auto;border:0;padding:0;flex-direction:row}
  .side-f .btn{width:auto;padding:6px 9px}
  .side-f .btn span{display:none}
  main#app{padding:16px 14px 60px}
}
@media print{
  .side,.mscrim,.modal{display:none!important}
  .shell{display:block}
  body.print-pac main#app>section{display:none!important}
  body.print-pac main#app>#view-pac{display:flex!important}
  body.print-pac .plans,body.print-pac #view-pac>.page-h,body.print-pac #view-pac>.notice{display:none!important}
}

/* V3.6 · tableau de bord personnalisable */
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:4px;column-gap:16px;row-gap:0;grid-auto-flow:row dense;align-items:start}
.dw{min-width:0;position:relative}
.dw-in{position:relative;min-width:0}
.dw-c{min-width:0}
.dw-c>.panel{margin:0}
.dw-c.fix{display:flex;flex-direction:column;overflow:hidden}
.dw-c.fix>*{flex:1 1 auto;min-height:0;overflow:auto}
.dw .kpis6{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.dedit-bar{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 12px;background:var(--accent-soft);border:1px dashed var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.dedit-bar .sub{display:block;margin-top:2px}
.dadd{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px}
.dadd .lbl{font:600 11px var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.dadd .chip svg{width:12px;height:12px;margin-right:4px;vertical-align:-1px}
.dgrid.edit .dw-in{outline:1.5px dashed var(--accent);outline-offset:3px;border-radius:10px}
.dw-bar{display:flex;align-items:center;gap:4px;background:var(--ink);color:var(--parch);border-radius:8px 8px 0 0;padding:4px 6px 4px 10px;margin-bottom:6px;font:500 12.5px var(--f-ui)}
.dw-grip{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding:3px 0}
.dw-b{background:#2A221D;border:1px solid #3A302A;color:#E8DCC6;border-radius:6px;padding:2px 8px;font:500 12px var(--f-ui);cursor:pointer;white-space:nowrap}
.dw-b:hover:not(:disabled){border-color:#C9804F;color:#fff}
.dw-b:disabled{opacity:.4;cursor:default}
.dw-sz{font-size:11.5px;min-width:34px;text-align:center;color:#E8DCC6}
.dw-rs{position:absolute;right:-6px;bottom:-6px;width:20px;height:20px;cursor:nwse-resize;touch-action:none;background:var(--accent);border:2px solid var(--surface);border-radius:5px 2px 5px 2px;box-shadow:var(--shadow);z-index:2}
.dw.dmoving .dw-in{opacity:.45}
.dw.dsizing .dw-in{outline-style:solid}
.dghost{position:fixed;z-index:200;pointer-events:none;background:var(--ink);color:var(--parch);font:500 12.5px var(--f-ui);padding:6px 10px;border-radius:7px;box-shadow:var(--shadow)}
body.dragging .dw-grip{cursor:grabbing}
body.dsz,body.dsz *{cursor:nwse-resize!important}
@media (max-width:700px){.dw-sz,.dw-b[data-dww]{display:none}}
/* Bloc-notes */
.nb-new{display:flex;gap:8px;align-items:flex-start;margin:4px 0 10px}
.nb-new textarea{flex:1;min-height:58px;resize:none}
.nb-new .btn svg{width:14px;height:14px}
.nb-l{display:flex;flex-direction:column;gap:8px}
.nb-i{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 8px 5px}
.nb-i.pin{border-color:var(--warn);background:var(--warn-soft)}
.nb-t{width:100%;border:0;background:transparent;resize:none;padding:2px 0;font:400 14px/1.45 var(--f-ui);color:var(--fg);overflow:hidden;min-height:24px}
.nb-t:focus{outline:none;box-shadow:inset 0 -1.5px 0 var(--accent)}
.nb-m{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:2px}
.nb-m .sub{font-size:11.5px}
.nb-b{background:none;border:0;color:var(--muted);font:500 12px var(--f-ui);padding:2px 5px;border-radius:5px;cursor:pointer}
.nb-b:hover{color:var(--accent);background:var(--surface-2)}
.nb-b.del:hover,.nb-b.armed{color:var(--bad);background:var(--bad-soft)}
.nb-db{min-width:min(620px,86vw)}
.qk-nb{grid-column:1/-1;flex-direction:row!important;justify-content:center;gap:7px!important;padding:8px 6px!important}
.qk-nb b{background:#C9804F;color:#fff;border-radius:9px;padding:0 6px;font-size:11px;line-height:17px}

/* V3.7 · bilan d'activité */
.bl-ctl{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.bl-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.bl-line .lbl{font:600 11px var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bl-line .chips{flex:1;min-width:0}
.bl-dep{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.bl-dep input{width:auto;padding:4px 8px}
.bl-ck{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;margin-right:12px;cursor:pointer}
.bl-k{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.bl-cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}

.bl-side{display:flex;flex-direction:column;gap:16px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}

.bl-wk{margin-top:12px}
.bl-wh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 6px;font:500 13px var(--f-ui);background:var(--surface-2);border-radius:6px;padding:6px 10px;margin-bottom:2px}
.bl-wh b{color:var(--accent)}
.bl-wh .n{margin-left:auto;color:var(--muted);font-size:12px}
.bl-r{display:grid;grid-template-columns:86px 28px minmax(0,1fr);gap:4px 10px;align-items:start;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:4px}
.bl-r:hover{background:var(--surface-2)}
.bl-r.nbk{cursor:default;background:var(--warn-soft)}
.bl-r.late .bl-d b{color:var(--bad)}
.bl-d b{display:block;font:600 13px var(--f-ui)}
.bl-d span{font-size:12px;color:var(--muted)}
.bl-o{font-size:14.5px;line-height:1.4}
.bl-ty{font:600 11px var(--f-label);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-right:7px}
.bl-r .m{font-size:13px;color:var(--muted);margin-top:2px}
.bl-n{margin-top:6px;border-left:3px solid var(--accent-soft);padding:2px 0 2px 10px;font-size:13.5px;color:var(--fg)}
.bl-n p{margin:0;white-space:pre-wrap}
.bl-n .crv{margin-top:6px}
.bl-mail{display:flex;align-items:center;gap:6px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--muted);font:400 13px var(--f-ui);padding:9px 6px 9px 130px;cursor:pointer;text-align:left}
.bl-mail:hover{color:var(--accent)}
.bl-mail svg{width:14px;height:14px}
@media (max-width:640px){.bl-r{grid-template-columns:64px minmax(0,1fr)}.bl-r .eic{display:none}.bl-mail{padding-left:6px}}

/* V3.8 · Suivi des devis : rouge = prélèvements estimatifs, bleu = définitifs */
:root{--est:#C62828;--est-soft:#FDE6E3;--def:#1F5FBF;--def-soft:#E2ECFA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--est:#FF8A7A;--est-soft:#3F1F1B;--def:#86B4FF;--def-soft:#1A2842}}
:root[data-theme="dark"]{--est:#FF8A7A;--est-soft:#3F1F1B;--def:#86B4FF;--def-soft:#1A2842}
.est{color:var(--est)!important}.def{color:var(--def)!important}
.sub.late,span.late{color:var(--bad)!important;font-weight:600}
.pill.dvs-brouillon{background:var(--grey-soft);color:var(--grey)}.pill.dvs-attente{background:var(--warn-soft);color:var(--warn)}
.pill.dvs-accepte{background:var(--ok-soft);color:var(--ok)}.pill.dvs-refuse{background:var(--bad-soft);color:var(--bad)}.pill.dvs-sansuite{background:var(--grey-soft);color:var(--muted)}
.dv-k{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.dv-k .kpi.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dv-k .kpi .v .num{font-size:22px}
@media (max-width:1100px){.dv-k{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}}
.dv-tbl td.nw{white-space:nowrap}
.dv-tbl .dv-tt{font-size:14.5px;font-weight:500}
.dv-tbl .dv-pl{line-height:1.35;white-space:nowrap}
.dv-tags{display:flex;flex-wrap:wrap;gap:4px;max-width:420px}
.dv-tg{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font:500 12px var(--f-label);color:var(--muted);background:var(--surface);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv-tg.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:var(--ok-soft);color:var(--ok)}
.dv-tg svg{width:11px;height:11px;flex:none}
.dv-tg i{font:600 10.5px var(--f-num);font-style:normal;border-radius:3px;padding:0 4px;color:var(--accent-ink)!important}
.dv-tg i.est{background:var(--est)}.dv-tg i.def{background:var(--def)}
.dv-rm{display:flex;flex-direction:column;gap:2px;min-width:90px}
.dv-rm .meter{margin-top:2px}
/* Tableau de bord */
.dv-wks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.dv-wk{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;cursor:pointer;font:inherit;color:inherit;min-width:0}
.dv-wk:hover{border-color:var(--muted)}
.dv-wk b{font:500 19px/1.2 var(--f-num)}
.dv-wk .sub{font-size:12px}
.dv-wl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px 18px}
.dv-wl h4{margin:4px 0 2px;font:600 11.5px var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px}
.dv-wr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:7px 2px;cursor:pointer;font:inherit;color:inherit}
.dv-wr:hover b{color:var(--accent)}
.dv-wr .grow{flex:1;min-width:0}.dv-wr .grow b{font-weight:600;font-size:13.5px}
.dv-wr .grow .sub{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv-wr .r{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.dv-wr .r .sub{font-size:11.5px}
/* Fiche compte */
.dv-card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:var(--surface);text-align:left;font:inherit;color:inherit;width:100%}
.dv-card:hover{border-color:var(--muted)}
.dv-card .ctop{display:flex;align-items:center;gap:8px}.dv-card .grow{flex:1}
.dv-card .dv-cl{display:flex;flex-direction:column;gap:2px}
.dv-card .dv-rm{flex-direction:row;align-items:center;gap:8px}.dv-card .dv-rm .meter{flex:1;margin:0}
/* Fenêtre devis */
.dv-form{display:flex;flex-direction:column;gap:18px}
.dv-head{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px}
.dv-head .s2{grid-column:span 2}.dv-head .s4{grid-column:1/-1}
.dv-seg{flex-wrap:wrap}
.dv-sec{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.dv-sh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dv-sh h3{margin:0;flex:1;font:600 13px var(--f-label);letter-spacing:.06em;text-transform:uppercase}
.dv-cat{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.dv-cat .g{display:flex;flex-direction:column;gap:6px}
.dv-cat .g>span{font:600 11px var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.dv-cat .chip{text-align:left}.dv-cat .chip svg{width:13px;height:13px;flex:none}
.filters.dv-f{grid-template-columns:minmax(0,2fr) minmax(0,.7fr) minmax(0,1.6fr) auto}
@media (max-width:760px){.filters.dv-f{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.filters.dv-f .field-s:first-child{grid-column:1/-1}}
.dv-cat .chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.dv-cat .chip[aria-pressed="true"] svg{color:var(--accent)}
.dv-lines{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.dv-l,.dv-lh{display:grid;grid-template-columns:minmax(200px,2.3fr) 118px minmax(330px,3fr) 112px 132px 32px;gap:10px;align-items:center;padding:10px 12px}
.dv-l{border-top:1px solid var(--line)}
.dv-lh{background:var(--surface-2);font:600 11px var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:7px 12px;border-radius:var(--r) var(--r) 0 0}
.dv-lh .r{text-align:right}
.dv-l.done{background:color-mix(in srgb,var(--ok-soft) 60%,var(--surface))}
.dv-c{display:flex;flex-direction:column;gap:3px;min-width:0}
.dv-m{display:none}
.dv-eu{position:relative;display:block}
.dv-eu input{width:100%;padding-right:22px!important;text-align:right}
.dv-eu i{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-style:normal;color:var(--muted);font-size:12.5px;pointer-events:none}
.dv-pr{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dv-pr .dv-nb{width:64px;text-align:right}
.dv-pr .dv-eu{width:96px}
.dv-pr input.est{color:var(--est);border-color:color-mix(in srgb,var(--est) 55%,var(--line));background:var(--est-soft);font-weight:600}
.dv-pr input.def{color:var(--def);border-color:color-mix(in srgb,var(--def) 55%,var(--line));background:var(--def-soft);font-weight:600}
.dv-pr .x{color:var(--muted)}
.dv-ed{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.dv-ed button{border:0;background:var(--surface);padding:5px 8px;font:600 11.5px var(--f-label);letter-spacing:.02em;cursor:pointer;color:var(--muted)}
.dv-ed button+button{border-left:1px solid var(--line)}
.dv-ed button.e.on{background:var(--est);color:var(--accent-ink)}.dv-ed button.d.on{background:var(--def);color:var(--accent-ink)}
.dv-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:2px 4px}
.dv-x:hover{color:var(--bad)}
.dv-addp{display:inline-flex;align-items:center;gap:5px;border:1px dashed var(--line);background:none;border-radius:6px;padding:5px 10px;color:var(--muted);cursor:pointer;font:500 12.5px var(--f-ui);width:max-content}
.dv-addp:hover{border-color:var(--accent);color:var(--accent)}
.dv-addp svg{width:13px;height:13px}
.dv-amt{align-items:flex-end;text-align:right}
.dv-amt .num{font-size:14px;font-weight:500}
.dv-amt .sub{font-size:11.5px}
.dv-fa input[type=date]{padding:4px 6px;font-size:12.5px}
.dv-del{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:5px;display:flex}
.dv-del svg{width:16px;height:16px}
.dv-del:hover{color:var(--bad);background:var(--bad-soft)}
.dv-tot{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;background:var(--surface-2);border-radius:var(--r);padding:12px 14px}
.dv-tot>div{display:flex;flex-direction:column;gap:2px}
.dv-tot b{font:500 17px/1.25 var(--f-num)}
.dv-tot .t b{font-size:21px}
.dv-tot .sub{font-size:12px}
.dv-leg{margin:0}
@media (max-width:1180px){
  .dv-lh{display:none}
  .dv-l{grid-template-columns:minmax(0,1fr) 120px 32px;grid-template-areas:"p p d" "x x x" "pr pr pr" "a f f";row-gap:10px}
  .dv-l>.dv-c:nth-child(1){grid-area:p}.dv-l>.dv-c:nth-child(2){grid-area:x}.dv-l>.dv-c:nth-child(3){grid-area:pr}
  .dv-l>.dv-amt{grid-area:a;align-items:flex-start;text-align:left}.dv-l>.dv-fa{grid-area:f;align-items:flex-end}.dv-l>.dv-del{grid-area:d}
  .dv-l>.dv-c:nth-child(2) .dv-eu{max-width:160px}
  .dv-m{display:block}
}
@media (max-width:760px){.dv-head{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.dv-head .dv-sp{display:none}.dv-tot{grid-template-columns:repeat(2,minmax(0,1fr))}}
.modal.compact .dv-head{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.modal.compact .dv-head .dv-sp{display:none}
.modal.compact .dv-lh{display:none}
.modal.compact .dv-l{grid-template-columns:minmax(0,1fr) 120px 32px;grid-template-areas:"p p d" "x x x" "pr pr pr" "a f f";row-gap:10px}
.modal.compact .dv-l>.dv-c:nth-child(1){grid-area:p}.modal.compact .dv-l>.dv-c:nth-child(2){grid-area:x}.modal.compact .dv-l>.dv-c:nth-child(3){grid-area:pr}
.modal.compact .dv-l>.dv-amt{grid-area:a;align-items:flex-start;text-align:left}.modal.compact .dv-l>.dv-fa{grid-area:f;align-items:flex-end}.modal.compact .dv-l>.dv-del{grid-area:d}
.modal.compact .dv-m{display:block}.modal.compact .dv-tot{grid-template-columns:repeat(2,minmax(0,1fr))}
.qk .qk-nb{grid-column:span 2}

/* V3.9 · devis dans le bilan */
.bl-dv{margin-bottom:16px}
.bl-dv .bl-dvk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.bl-dv .bl-dvl{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px 18px}

.bl-dv .dv-wr .bl-dd{font-size:12px;color:var(--muted);width:50px;flex:none}
.bl-dv .bl-enc{margin:0;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.bl-dv .bl-enc b{color:var(--fg);font-weight:600}

/* V3.10 · import de devis Word */
.dv-imp{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}.dv-imp>span{flex:1;min-width:260px}
.dv-impb{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px}
.dv-impb .btn svg,.page-h .btn svg{width:15px;height:15px}
body.dv-drop #view-devis,body.dv-drop #modal{outline:3px dashed var(--accent);outline-offset:-6px}

/* V3.11 · intégration Excel */
.dvx-g{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,1.4fr);gap:18px;align-items:start}
@media (max-width:900px){.dvx-g{grid-template-columns:minmax(0,1fr)}}
.dvx-l{display:flex;flex-direction:column;gap:8px;min-width:0}
.dvx-list{border:1px solid var(--line);border-radius:var(--r);max-height:56vh;overflow:auto}
.dvx-a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer}
.dvx-a:first-child{border-top:0}.dvx-a.on{background:var(--accent-soft)}
.dvx-a input{accent-color:var(--accent);width:16px;height:16px;margin:0;flex:none}
.dvx-a .grow{flex:1;min-width:0}.dvx-a .grow b{font-weight:600;display:block}.dvx-a .sub{font-size:12px}
.dvx-s{display:flex;flex-direction:column;gap:12px;min-width:0}
.dvx-r{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}

/* V3.12 · avoirs signalés */
.dv-av{display:inline-block;margin-left:6px;font:600 10.5px var(--f-label);letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:1px 6px;background:var(--bad-soft);color:var(--bad);white-space:nowrap;vertical-align:middle}

<script>
(function(){
"use strict";
/* ---------- Référentiels ---------- */
const STAGES=[
  {k:"a_qualifier",l:"À qualifier"},{k:"cible",l:"Ciblé"},{k:"rdv",l:"RDV pris"},
  {k:"visite",l:"Visité"},{k:"opportunite",l:"Opportunité créée"},{k:"gagne",l:"Gagné"},{k:"sans_suite",l:"Sans suite"}];
const SL=Object.fromEntries(STAGES.map(s=>[s.k,s.l]));
const SIDX=Object.fromEntries(STAGES.map((s,i)=>[s.k,i]));
const BUS=["Construction","Équipements","Environnement","Infrastructures","Autre BU"];
const SEGMENTS=["Industriel","Logistique / entrepôts","Tertiaire / bureaux","Bailleur social","Foncière / investisseur","Promoteur","Syndic / administrateur de biens","Property / facility management","Collectivité / établissement public","Maîtrise d'œuvre / architecte / BET","Entreprise de travaux (prescripteur)","Expert d'assurance / après sinistre","Autre"];
const PRESTA=[["AMI","Amiante"],["CREP","Plomb"],["DPE","DPE / audit énergétique"],["GAZ","Gaz"],["ÉLEC","Électricité"],["TERM","Termites"],["PEMD","PEMD (avant démolition)"],["VENTE","Avant vente / relocation"],["AUTRE","Autre"]];
const PLABEL=Object.fromEntries(PRESTA);
const SOURCES=["Autre BU","Café Commerce","Réunion inter-BU","Événement client","Prospection directe","Lead Athena"];
const MOTIFS=["Accord-cadre concurrent","Pas de besoin","Prix","Pas de réponse","Autre"];
const VSTAT=["Planifiée","Réalisée","Annulée"];
const OSTAT=["Ouvert","Conclue","Perdu"];
const TYPES=["Client existant","Prospect","Prescripteur"];
const DEPTS=[["75","Paris"],["77","Seine-et-Marne"],["78","Yvelines"],["91","Essonne"],["92","Hauts-de-Seine"],["93","Seine-Saint-Denis"],["94","Val-de-Marne"],["95","Val-d'Oise"]];
const DNAME=Object.fromEntries(DEPTS);const dLabel=d=>d?(DNAME[d]?d+" · "+DNAME[d]:d):"";
const CAMPAGNE_DEF="PAC IDF – Clients autres BU – T4 2026";

/* ---------- Utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const addDaysISO=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const fdate=iso=>{if(!iso)return "";const [y,m,d]=iso.split("-");return d+"/"+m+"/"+y};
const eur=n=>(Number(n)||0).toLocaleString("fr-FR",{maximumFractionDigits:0})+" €";
const uid=()=>"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const isActive=c=>c.etape!=="gagne"&&c.etape!=="sans_suite";
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800)}


/* ================= V3 · État, modèle Comptes / Contacts / Actions, migration ================= */
const nh=x=>String(x==null?"":x).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const now=()=>new Date().toISOString();
const S={open:new Set(),mode:"wait",cibles:[],comptes:[],contacts:[],actions:[],plans:[],pac:[],mailing:[],devis:[],settings:{objectif:8},writable:true,view:"actives",tab:"tdb",kid:"",db:null,downloads:null,ver:0};
const LS_KEY="pac-idf-v1",BK_KEY="pac-idf-copie-v2",SCHEMA=3,VERSION="V3.12";
let STORE="ls"; /* "idb" dès que les données sont dans la base du navigateur */
const IN_FRAME=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const TYPE_RANK={"Client existant":3,"Prescripteur":2,"Prospect":1};

/* Cible = un compte suivi dans une campagne de prospection (étape, priorité, potentiel, opportunité) */
function blank(){
  return {compteId:"",compte:"",dept:"",campagne:CAMPAGNE_DEF,source:"Autre BU",bu:[],apporteur:"",prestations:[],potentiel:"",priorite:"B",etape:"a_qualifier",agence:"",accompagnant:"",
    motif:"",notes:"",leadIds:[],opp:{creee:false,montant:"",statut:"Ouvert",devis:"",date:""}};
}
function guessDept(c){
  const nx=x=>String(x||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const camp=nx(c.campagne);for(const [code,name] of DEPTS){if(camp.includes(nx(name)))return code}
  const m=String(c.notes||"").match(/(?:Site|Siège)\s*:[^·]*?\b(7[5789]|9[1-5])\d{3}\b/);if(m)return m[1];
  const m2=String(c.notes||"").match(/\b(7[5789]|9[1-5])\d{3}\b/);if(m2)return m2[1];
  return ""}
function norm(c){const b=blank();const o=Object.assign(b,c||{});o.opp=Object.assign(blank().opp,(c&&c.opp)||{});
  o.bu=Array.isArray(o.bu)?o.bu:[];o.prestations=Array.isArray(o.prestations)?o.prestations:[];o.leadIds=Array.isArray(o.leadIds)?o.leadIds:[];
  if(!SIDX.hasOwnProperty(o.etape))o.etape="a_qualifier";if(!o.dept)o.dept=guessDept(o);return o}
/* Compte, contact, action */
function kblank(){return {nom:"",type:"Prospect",segment:"",typologie:"",dept:"",adresse:"",ville:"",web:"",tel:"",agence:"",apporteur:"",notes:"",origine:"",contrat:false,sousTypo:"",fiab:"",histo:null}}
const knorm=x=>Object.assign(kblank(),x||{});
function ctblank(){return {compteId:"",nom:"",fonction:"",tel:"",mail:"",notes:"",principal:false}}
const ctnorm=x=>{const o=Object.assign(ctblank(),x||{});o.principal=!!o.principal;return o};
function ablank(){return {compteId:"",cibleId:"",contactId:"",type:"appel",date:"",heure:"",statut:"afaire",objet:"",details:"",resultat:"",accompagnant:"",interlocuteur:"",lieu:"",suite:"",faitLe:""}}
const anorm=x=>{const o=Object.assign(ablank(),x||{});if(!["afaire","fait","annule"].includes(o.statut))o.statut="afaire";return o};

/* Index recalculés à chaque modification */
let IXC=null,IXV=-1;
const bump=()=>{S.ver++};
function IX(){if(IXC&&IXV===S.ver)return IXC;
  const g=(arr,k)=>{const m=new Map();for(const x of arr){const v=x[k];if(!v)continue;let l=m.get(v);if(!l)m.set(v,l=[]);l.push(x)}return m};
  const byName=new Map();S.comptes.forEach(k=>{const n=nh(k.nom);if(n&&!byName.has(n))byName.set(n,k)});
  IXC={compte:new Map(S.comptes.map(k=>[k.id,k])),byName,cib:g(S.cibles,"compteId"),ct:g(S.contacts,"compteId"),act:g(S.actions,"compteId"),ml:g(S.mailing,"compteId"),
    contact:new Map(S.contacts.map(c=>[c.id,c])),cible:new Map(S.cibles.map(c=>[c.id,c]))};
  IXV=S.ver;return IXC}
const kOf=id=>id?IX().compte.get(id)||null:null;
const cibOf=kid=>IX().cib.get(kid)||[];
const ctOf=kid=>IX().ct.get(kid)||[];
const actOf=kid=>IX().act.get(kid)||[];
const mlOf=kid=>IX().ml.get(kid)||[];
const ctById=id=>id?IX().contact.get(id)||null:null;
const cibById=id=>id?IX().cible.get(id)||null:null;
const findCompte=name=>{const n=nh(name);return n?IX().byName.get(n)||null:null};
const secteurOf=k=>k?(k.segment||k.typologie||""):"";
const typeOf=c=>{const k=kOf(c.compteId);return k?k.type:""};
const principal=kid=>{const L=ctOf(kid);return L.find(x=>x.principal)||L[0]||null};
const isOpen=a=>a.statut==="afaire";
const isRdv=t=>t==="visite"||t==="visio";
const aSort=(a,b)=>(a.date||"9999").localeCompare(b.date||"9999")||(a.heure||"99").localeCompare(b.heure||"99");
const aSortDesc=(a,b)=>(b.date||"").localeCompare(a.date||"")||(b.heure||"").localeCompare(a.heure||"")||String(b.majLe||"").localeCompare(String(a.majLe||""));
function nextOf(kid){let best=null;for(const a of actOf(kid)){if(!isOpen(a))continue;if(!best||aSort(a,best)<0)best=a}return best}
const nextFor=c=>nextOf(c.compteId);
/* Dernier contact réel : action faite (hors notes) ou mail envoyé depuis le mailing */
function lastOf(kid){let d="",lab="";const t=todayISO();
  actOf(kid).forEach(a=>{if(a.statut==="fait"&&a.type!=="note"&&a.date&&a.date<=t&&a.date>d){d=a.date;lab=ALBL[a.type]||a.type}});
  mlOf(kid).forEach(m=>{if(m.envoye&&m.dateEnvoi&&m.dateEnvoi>d){d=m.dateEnvoi;lab="Mail (mailing)"}});
  return d?{date:d,label:lab}:null}
const visitsOf=c=>actOf(c.compteId).filter(a=>a.type==="visite"&&(!a.cibleId||a.cibleId===c.id));
const visitsDone=c=>visitsOf(c).filter(a=>a.statut==="fait").length;
const lastDone=c=>{const d=visitsOf(c).filter(a=>a.statut==="fait"&&a.date).map(a=>a.date).sort();return d.length?d[d.length-1]:""};
const lastContact=c=>{const l=lastOf(c.compteId);return l?l.date:""};
const caOf=kid=>mlOf(kid).reduce((s,m)=>s+(Number(String(m.ca||"").replace(/[^\d,.\-]/g,"").replace(",","."))||0),0);
function autoStage(c){
  if(c.etape==="sans_suite"||c.etape==="gagne")return;
  let t=SIDX[c.etape];const V=visitsOf(c);
  if(V.some(a=>a.statut==="afaire"))t=Math.max(t,SIDX.rdv);
  if(V.some(a=>a.statut==="fait"))t=Math.max(t,SIDX.visite);
  if(c.opp.creee)t=Math.max(t,SIDX.opportunite);
  if(c.opp.creee&&c.opp.statut==="Conclue")t=SIDX.gagne;
  c.etape=STAGES[t].k;
}
/* Recalcule l'étape des cibles d'un compte après une action (RDV planifié, visite réalisée) */
function restage(kid){cibOf(kid).forEach(c=>{const b=c.etape;autoStage(c);if(c.etape!==b){c.majLe=now()}});bump()}

/* ---------- Création / rapprochement ---------- */
function ensureCompte(name,init){const n=String(name||"").trim()||"Sans nom";let k=findCompte(n);if(k)return k;
  k=Object.assign(kblank(),init||{},{id:uid(),nom:n,creeLe:now(),majLe:now()});S.comptes.push(k);
  if(IXC&&IXV===S.ver){IXC.compte.set(k.id,k);const m=nh(k.nom);if(m&&!IXC.byName.has(m))IXC.byName.set(m,k)}else bump();return k}
function findContact(kid,d){const L=ctOf(kid),mail=String(d.mail||"").trim().toLowerCase(),n=nh(d.nom);
  return (mail&&L.find(x=>String(x.mail||"").toLowerCase()===mail))||(n&&L.find(x=>nh(x.nom)===n))||null}
function ensureContact(kid,d){let ct=findContact(kid,d);
  if(ct){["nom","fonction","tel","mail"].forEach(f=>{if(!ct[f]&&d[f])ct[f]=String(d[f]).trim()});return ct}
  ct=Object.assign(ctblank(),{id:uid(),compteId:kid,nom:String(d.nom||"").trim(),fonction:String(d.fonction||"").trim(),tel:String(d.tel||"").trim(),mail:String(d.mail||"").trim(),principal:!ctOf(kid).length,creeLe:now(),majLe:now()});
  S.contacts.push(ct);
  if(IXC&&IXV===S.ver){IXC.contact.set(ct.id,ct);let l=IXC.ct.get(kid);if(!l)IXC.ct.set(kid,l=[]);l.push(ct)}else bump();return ct}
/* Statut d'un ancien échange ou d'une ancienne visite */
const legStat=r=>/^(Planifi|À faire|A faire)/i.test(r||"")?"afaire":/^Annul/i.test(r||"")?"annule":"fait";
function addLegacyAction(x,k,c,ctId){
  const id=String(x.id||uid());if(S.actions.some(a=>a.id===id))return;
  const ty=x.k==="v"?"visite":(["visite","visio","appel","mail","evenement","autre"].includes(x.type)?x.type:"autre");
  const res=x.k==="v"?(x.statut||""):(x.resultat||"");
  let ct=ctId;if(x.interlocuteur){const f=findContact(k.id,{nom:x.interlocuteur});if(f)ct=f.id}
  S.actions.push(anorm({id,compteId:k.id,cibleId:c.id,contactId:ct,type:ty,date:x.date||"",statut:legStat(res),
    resultat:/^(Planifi|Réalis|Annul|Rencontr|Fait|À faire)/i.test(res)?"":res,objet:x.objet||"",details:x.cr||x.details||"",accompagnant:x.accompagnant||"",
    interlocuteur:x.interlocuteur||"",suite:[x.suite,x.relance?"le "+fdate(x.relance):""].filter(Boolean).join(" "),faitLe:legStat(res)==="fait"?(x.date||""):"",creeLe:c.creeLe||now(),majLe:c.majLe||now(),origine:"V2"}));bump()}
/* Une fiche « cible » de la V2 (ou d'un import Excel) : le compte, le contact, les visites, les échanges et la prochaine action
   partent dans le compte ; la cible garde le suivi de prospection */
const LEGACY=["contact","fonction","tel","mail","visites","echanges","prochaineAction","prochaineLibelle","type","segment","copieDe"];
function absorbCible(raw){
  const L={};const src=Object.assign({},raw||{});LEGACY.forEach(f=>{if(f in src){L[f]=src[f];delete src[f]}});
  const c=norm(src);if(!c.id)c.id=uid();
  let k=kOf(c.compteId);
  if(!k)k=ensureCompte(c.compte||"Sans nom",{type:L.type||"Prospect",segment:L.segment||"",dept:c.dept||"",origine:"cible"});
  if(L.type&&(TYPE_RANK[L.type]||0)>(TYPE_RANK[k.type]||0))k.type=L.type;
  if(L.segment&&!k.segment)k.segment=L.segment;
  if(!k.dept&&c.dept)k.dept=c.dept;
  c.compteId=k.id;c.compte=k.nom;
  let ctId="";
  if(L.contact||L.tel||L.mail){const ct=ensureContact(k.id,{nom:L.contact||"",fonction:L.fonction||"",tel:L.tel||"",mail:L.mail||""});ctId=ct.id}
  (Array.isArray(L.visites)?L.visites:[]).forEach(v=>addLegacyAction(Object.assign({},v,{k:"v"}),k,c,ctId));
  (Array.isArray(L.echanges)?L.echanges:[]).forEach(e=>addLegacyAction(Object.assign({},e,{k:"e"}),k,c,ctId));
  if(L.prochaineAction||L.prochaineLibelle){const ob=String(L.prochaineLibelle||"Relancer").trim(),d=L.prochaineAction||"";
    if(!actOf(k.id).some(a=>isOpen(a)&&nh(a.objet)===nh(ob)&&(a.date||"")===d)){
      S.actions.push(anorm({id:uid(),compteId:k.id,cibleId:"",contactId:ctId,type:"tache",date:d,objet:ob,statut:"afaire",creeLe:c.majLe||c.creeLe||now(),majLe:now(),origine:"prochaine action"}));bump()}}
  return c}
/* Ligne de mailing : rattachée à un compte (créé si besoin) et à un contact */
const mType=()=>"Client existant"; /* toutes les listes de mailing sont des clients déjà facturés */
function absorbMailing(m){
  if(!(m.compteId&&kOf(m.compteId))){
    const name=String(m.client||m.mail||"").trim()||"Sans nom";let k=findCompte(name);
    if(!k)k=ensureCompte(name,{type:mType(m),typologie:m.typologie||"",agence:m.agence||"",apporteur:m.apporteur||"",origine:"mailing"});
    else{if(!k.typologie&&m.typologie)k.typologie=m.typologie;if(!k.agence&&m.agence)k.agence=m.agence;if(!k.apporteur&&m.apporteur)k.apporteur=m.apporteur}
    m.compteId=k.id}
  if(!(m.contactId&&ctById(m.contactId))&&(m.contact||m.mail)){const ct=ensureContact(m.compteId,{nom:m.contact||"",mail:m.mail||""});m.contactId=ct.id}
  return m}

/* ---------- Plans du PAC ---------- */
const PAXES=[["secteur","Par secteur d'activité"],["theme","Par plan d'action"],["famille","Par famille de clients"],["autre","Autre"]];
function ensurePlans(){
  if(!S.plans.length){S.plans.push({id:uid(),nom:"PAC IDF "+(S.settings.pacPeriode||new Date().getFullYear()),axe:"theme",titre:S.settings.pacTitre||PAC_TITRE_DEF,periode:S.settings.pacPeriode||String(new Date().getFullYear()),ordre:1,creeLe:now()})}
  const ids=new Set(S.plans.map(p=>p.id));S.pac.forEach(l=>{if(!ids.has(l.planId))l.planId=S.plans[0].id});
  if(!ids.has(S.settings.planCourant))S.settings.planCourant=S.plans[0].id}
function curPlan(){ensurePlans();return S.plans.find(p=>p.id===S.settings.planCourant)||S.plans[0]}

/* ---------- Migration V2 → V3 ---------- */
function migrateV2(r){
  S.settings=Object.assign({objectif:8},r.settings||{});
  S.comptes=[];S.contacts=[];S.actions=[];S.cibles=[];S.mailing=[];S.plans=[];bump();
  (r.cibles||[]).forEach(x=>{S.cibles.push(absorbCible(Object.assign({},x,{id:x.id||uid()})));bump()});
  (r.mailing||[]).forEach(x=>{S.mailing.push(absorbMailing(mnorm(Object.assign({},x,{id:x.id||uid()}))));bump()});
  S.pac=(r.pac||[]).map(pnorm);ensurePlans();
  S.cibles.forEach(autoStage);bump();upgrade31();
}
/* Réparation légère au chargement : tout lien cassé est recréé */
function repairLinks(){
  S.cibles=S.cibles.map(c=>kOf(c.compteId)?c:absorbCible(c));bump();
  S.mailing.forEach(m=>{if(!kOf(m.compteId))absorbMailing(m)});
  const kids=new Set(S.comptes.map(k=>k.id));
  S.contacts.forEach(ct=>{if(!kids.has(ct.compteId)){const k=ensureCompte("Contacts sans compte");ct.compteId=k.id}});
  S.actions.forEach(a=>{if(!kids.has(a.compteId)){const k=ensureCompte("Actions sans compte");a.compteId=a.compteId&&kids.has(a.compteId)?a.compteId:k.id}});
  S.devis.forEach(d=>{if(!kids.has(d.compteId)){const k=ensureCompte("Devis sans compte");d.compteId=k.id}});
  S.cibles.forEach(c=>{const k=kOf(c.compteId);if(k&&c.compte!==k.nom)c.compte=k.nom});bump()}

/* ---------- Persistance (navigateur) ---------- */
function setSync(mode,txt){S.mode=mode;const a=$("#sync"),b=$("#syncTxt");if(a)a.dataset.s=mode;if(b)b.textContent=txt}
const snapshot=()=>({schema:SCHEMA,cibles:S.cibles,comptes:S.comptes,contacts:S.contacts,actions:S.actions,plans:S.plans,pac:S.pac,mailing:S.mailing,devis:S.devis,settings:S.settings});
let saveWarned=false;
function lsSave(){bump();
  if(STORE==="idb"){idbQueue();return true}
  const txt=JSON.stringify(snapshot());
  try{localStorage.setItem(LS_KEY,txt);if(S.mode==="warn"&&!saveWarned)setSync("local","Enregistré sur ce poste");return true}
  catch(e){
    /* Espace plein : la copie de l'ancienne version (déjà dans votre sauvegarde) est libérée en premier */
    try{if(localStorage.getItem(BK_KEY)){localStorage.removeItem(BK_KEY);localStorage.setItem(LS_KEY,txt);S.settings.copieV2Liberee=true;return true}}catch(_){}
    saveWarned=true;setSync("warn","Non enregistré");toast("Enregistrement impossible : l'espace du navigateur est plein. Faites une sauvegarde complète (Exporter).");return false}}
function commit(){lsSave();render()}
function put(coll,o){o.majLe=now();const L=S[coll],i=L.findIndex(x=>x.id===o.id);if(i>=0)L[i]=o;else L.push(o);bump();return o}
function drop(coll,id){S[coll]=S[coll].filter(x=>x.id!==id);bump()}
async function saveCible(c){const k=kOf(c.compteId)||ensureCompte(c.compte);c.compteId=k.id;c.compte=k.nom;put("cibles",c);commit();return true}
async function deleteCible(id){drop("cibles",id);S.actions.forEach(a=>{if(a.cibleId===id)a.cibleId=""});commit();return true}
async function saveSettings(){lsSave()}
async function savePac(p){if(!p.planId)p.planId=curPlan().id;put("pac",p);commit();return true}
async function deletePac(id){drop("pac",id);commit();return true}
async function bulkApply(saves,dels){const del=new Set(dels);S.cibles=S.cibles.filter(x=>!del.has(x.id));
  saves.forEach(c=>{const k=kOf(c.compteId)||ensureCompte(c.compte);c.compteId=k.id;c.compte=k.nom;c.majLe=now();const i=S.cibles.findIndex(x=>x.id===c.id);if(i>=0)S.cibles[i]=c;else S.cibles.push(c)});
  bump();commit();return true}
function dbErr(){toast("Enregistrement impossible pour le moment.");return false}
function applyRO(){}

function lsLoad(){
  let raw=null;try{raw=localStorage.getItem(LS_KEY)}catch(e){return {blocked:true}}
  if(!raw){ensurePlans();return {fresh:true}}
  let r;try{r=JSON.parse(raw)}catch(e){return {corrupt:true}}
  if(r&&r.storage==="idb"){ensurePlans();return {lost:true}}

function mergeComptes(srcId,dstId){const a=kOf(srcId),b=kOf(dstId);if(!a||!b||a.id===b.id)return false;
  Object.keys(kblank()).forEach(f=>{if(f==="notes"){if(a.notes&&!String(b.notes).includes(a.notes))b.notes=[b.notes,a.notes].filter(Boolean).join("\n")}else if(!b[f]&&a[f])b[f]=a[f]});
  if((TYPE_RANK[a.type]||0)>(TYPE_RANK[b.type]||0))b.type=a.type;if(a.contrat)b.contrat=true;
  const map={};ctOf(a.id).slice().forEach(c=>{const ex=findContact(b.id,c);if(ex){["fonction","tel","mail","notes"].forEach(f=>{if(!ex[f]&&c[f])ex[f]=c[f]});map[c.id]=ex.id;S.contacts=S.contacts.filter(x=>x.id!==c.id)}else{c.compteId=b.id;if(ctOf(b.id).some(x=>x.principal))c.principal=false}});
  S.actions.forEach(x=>{if(x.compteId===a.id){x.compteId=b.id;if(map[x.contactId])x.contactId=map[x.contactId]}});
  S.mailing.forEach(m=>{if(m.compteId===a.id){m.compteId=b.id;if(map[m.contactId])m.contactId=map[m.contactId]}});
  S.cibles.forEach(c=>{if(c.compteId===a.id){c.compteId=b.id;c.compte=b.nom}});
  S.devis.forEach(d=>{if(d.compteId===a.id){d.compteId=b.id;if(map[d.contactId])d.contactId=map[d.contactId]}});
  S.comptes=S.comptes.filter(x=>x.id!==a.id);b.majLe=now();bump();restage(b.id);return true}

function mergeGroup(g){
  const m=clone(g[0]),rest=g.slice(1);
  ["agence","apporteur","accompagnant","source","campagne","motif"].forEach(k=>{if(!m[k]){const o=rest.find(x=>x[k]);if(o)m[k]=o[k]}});
  g.forEach(x=>{if(x.priorite&&(!m.priorite||x.priorite<m.priorite))m.priorite=x.priorite;if((Number(x.potentiel)||0)>(Number(m.potentiel)||0))m.potentiel=x.potentiel});
  m.bu=[...new Set(g.flatMap(x=>x.bu))];
  m.prestations=PRESTA.map(p=>p[0]).filter(p=>g.some(x=>x.prestations.includes(p))).concat([...new Set(g.flatMap(x=>x.prestations))].filter(p=>!PLABEL[p]));
  let notes=[];g.forEach(x=>{const t=String(x.notes||"").trim();if(!t||notes.some(n=>n.includes(t)))return;notes=notes.filter(n=>!t.includes(n));notes.push(t)});
  m.notes=notes.join("\n");m.leadIds=[...new Set(g.flatMap(x=>x.leadIds||[]))];
  if(!(m.opp&&m.opp.creee)){const o=rest.find(x=>x.opp&&x.opp.creee);if(o)m.opp=clone(o.opp)}
  const ord=["a_qualifier","cible","rdv","visite","opportunite","gagne"];g.forEach(x=>{if(ord.indexOf(x.etape)>ord.indexOf(m.etape))m.etape=x.etape});
  const cr=g.map(x=>x.creeLe).filter(Boolean).sort()[0];if(cr)m.creeLe=cr;
  const r=norm(m);autoStage(r);return r}

/* Import d'un PAC Excel (formats « Vierge » et « Feuil1 » du PAC France) */
const PAC_COLS=[[/^priorite|^prio/,"prio"],[/^plan d action$/,"pa"],[/^elements?$/,"el"],[/^objectifs?$/,"objectif"],[/^descriptif/,"descriptif"],[/^actions?$/,"actions"],
  [/^(trimestre|t) ?1$/,"t1"],[/^(trimestre|t) ?2$/,"t2"],[/^(trimestre|t) ?3$/,"t3"],[/^(trimestre|t) ?4$/,"t4"],
  [/^qui/,"qui"],[/^quand/,"quand"],[/indicateur|kpi/,"kpi"],[/^resultats? attendus?/,"attendus"],[/^resultats?( obtenus?)?$/,"obtenus"],
  [/^continuer$/,"d:Continuer"],[/^modifier$/,"d:Modifier"],[/^reporter$/,"d:Reporter"],[/^arreter$/,"d:Arrêter"]];
const pacCol=n=>{const h=PAC_COLS.find(([re])=>re.test(n));return h?h[1]:null};
async function parsePacFile(file){
  await loadExcel();const wb=new ExcelJS.Workbook();await wb.xlsx.load(await file.arrayBuffer());
  const sheets=[];
  wb.worksheets.forEach(ws=>{if(ws.state==="hidden")return;
    const txt=(r,c)=>{const v=cellVal(ws.getRow(r).getCell(c).value);return v instanceof Date?fdate(toISO(v)):String(v==null?"":v).trim()};
    const maxC=Math.min(ws.columnCount||0,40),maxR=ws.rowCount||0;let hr=0;
    for(let r=1;r<=Math.min(maxR,15)&&!hr;r++)for(let c=1;c<=maxC;c++){if(/^objectifs?$/.test(nh(txt(r,c)))){hr=r;break}}
    if(!hr)return;
    const subRow=r=>{let k=0;for(let c=1;c<=maxC;c++){const f=pacCol(nh(txt(r,c)));if(f&&/^(t\d|qui|quand|kpi|d:|attendus)/.test(f))k++}return k>=2};
    const sub=hr<maxR&&subRow(hr+1)?hr+1:0;
    const map={};for(let c=1;c<=maxC;c++){const a=nh(txt(hr,c)),b=sub?nh(txt(sub,c)):"";const f=(b&&b!==a&&pacCol(b))||pacCol(a);if(f&&!Object.values(map).includes(f))map[c]=f}
    const recs=[];
    for(let r=(sub||hr)+1;r<=maxR;r++){const o={};let any=false;
      Object.entries(map).forEach(([c,f])=>{const v=txt(r,+c);if(!v)return;any=true;if(f.startsWith("d:"))o.decision=f.slice(2);else o[f]=v});
      if(!any)continue;
      const p=pblank();
      if(o.pa&&o.el){p.element=o.pa;p.objectif=o.el;p.descriptif=[o.objectif,o.descriptif].filter(Boolean).join("\n")}
      else{p.element=o.pa||o.el||"";p.objectif=o.objectif||"";p.descriptif=o.descriptif||""}
      ["actions","t1","t2","t3","t4","qui","quand","kpi","attendus","obtenus","decision"].forEach(k=>{if(o[k])p[k]=o[k]});if(o.prio)p.prio=toPrio(o.prio);
      if(!p.element&&!p.objectif)continue;if(!p.element){p.element=p.objectif;p.objectif=""}
      recs.push(p)}
    if(recs.length)sheets.push({name:ws.name,recs,filled:recs.reduce((s,p)=>s+["objectif","descriptif","actions","t1","t2","t3","t4","qui","quand","kpi","attendus"].filter(k=>p[k]).length,0)});
  });
  if(!sheets.length)throw new Error("none");
  sheets.sort((a,b)=>b.filled-a.filled);return {sheets,pick:0};
}

    (j.cibles||[]).forEach(x=>{const id=x.id||uid(),i=S.cibles.findIndex(c=>c.id===id);const prev=i>=0?S.cibles[i]:null;
      const c=absorbCible(Object.assign({},x,{id,compteId:prev?prev.compteId:""}));if(i>=0)S.cibles[i]=c;else S.cibles.push(c);bump()});

    bump();ensurePlans();S.cibles.forEach(autoStage)}
  if(j.histo&&typeof j.histo==="object"){try{await hPutMany(new Map(Object.entries(j.histo)))}catch(e){}}
  lsSave();closeDrawer();render();
  const d=(a,b)=>a-b;
  toast("Restauré · "+[pl(S.cibles.length,"cible"),pl(S.comptes.length,"compte")+(S.comptes.length>before.k?" (+"+d(S.comptes.length,before.k)+")":""),pl(S.actions.length,"action"),pl(S.mailing.length,"ligne")+" de mailing",pl(S.pac.length,"ligne")+" de PAC"].join(" · "));
}

/* ---------- Doublons : même client dans le même département ---------- */
let DUP=null,UNDO=null;
const dupKey=c=>{if(c.exemple)return "";const k=c.compteId||nh(c.compte);return k?k+"|"+(c.dept||""):""};
const STAGE_RANK={a_qualifier:0,cible:1,rdv:2,sans_suite:2,visite:3,opportunite:4,gagne:5};
const dupSig=g=>dupKey(g[0])+"#"+g.map(c=>c.id).sort().join(",");
function dupGroups(){
  const m={};S.cibles.forEach(c=>{const k=dupKey(c);if(k)(m[k]=m[k]||[]).push(c)});
  return Object.values(m).filter(g=>g.length>1)
    .map(g=>g.slice().sort((a,b)=>dupScore(b)-dupScore(a)||String(b.majLe||b.creeLe||"").localeCompare(String(a.majLe||a.creeLe||""))))
    .sort((a,b)=>a[0].compte.localeCompare(b[0].compte,"fr"))}
const dupIgnored=g=>(S.settings.dupIgnore||[]).includes(dupSig(g));
/* Fusion : la première fiche du groupe est conservée et complétée par les autres */
/* Enregistrement groupé : un seul rendu en mode local */
function renderDupNote(){
  const n=$("#dupNote");if(!n)return;
  if(!S.writable){n.hidden=true;return}
  if(UNDO){n.hidden=false;n.className="notice";
    n.innerHTML='<span><b>Doublons fusionnés</b> : '+pl(UNDO.n,"fiche")+' en trop supprimée'+(UNDO.n>1?'s':'')+'.</span><button class="btn" type="button" data-act="dupundo">Annuler la fusion</button><button class="btn ghost" type="button" data-act="dupok">OK</button>';return}
  const g=dupGroups().filter(x=>!dupIgnored(x)),extra=g.reduce((s,x)=>s+x.length-1,0);
  if(!extra){n.hidden=true;return}
  n.hidden=false;n.className="notice warn";
  n.innerHTML='<span><b>'+pl(extra,"doublon")+'</b> : '+pl(g.length,"client")+' en plusieurs exemplaires dans le même département.</span><button class="btn primary" type="button" data-act="dupmenu">Voir et fusionner</button>';
}
function dupMenu(){
  const groups=dupGroups();DUP=groups;
  const d=$("#drawer");
  const row=(c,j)=>'<span class="dupr">'+(j?'<span class="gone">Fusionnée</span>':'<span class="keep">Conservée</span>')+
    '<span class="pill st-'+c.etape+'">'+esc(SL[c.etape])+'</span>'+esc([campShort(c),visitsDone(c)?pl(visitsDone(c),"visite"):"",c.potentiel?eur(c.potentiel):"",c.opp&&c.opp.creee?"opportunité":""].filter(Boolean).join(" · "))+'</span>';
  d.innerHTML='<div class="dh"><div class="grow"><span class="lbl">Doublons</span><h2 id="dTitle">'+(groups.length?'Fusionner les doublons':'Aucun doublon')+'</h2></div><button class="btn ghost" type="button" data-act="close">Fermer</button></div>'+
  '<div class="db">'+(groups.length?
   '<div class="imp-sum" id="dupSum"></div>'+
   '<p class="hint">Un doublon, c\'est le même client dans le même département. Pour chacun, l\'application garde la fiche la plus avancée (opportunité, visites, étape) et la complète avec les autres : diagnostics visés, BU, priorité, potentiel, notes, opportunité. Les contacts et les actions restent sur le compte. Les fiches en trop sont supprimées. Décochez un client pour le laisser tel quel.</p>'+
   '<div class="cpl">'+groups.map((g,i)=>'<label class="dupg"><input type="checkbox" data-dg="'+i+'"'+(dupIgnored(g)?'':' checked')+'><span class="grow"><b>'+esc(g[0].compte)+'</b>'+(g[0].dept?' <span class="ty">'+esc(g[0].dept)+'</span>':'')+' <span class="sub">'+pl(g.length,"fiche")+'</span>'+g.map(row).join("")+'</span></label>').join("")+'</div>'

  (groups.length?'<div class="df"><span class="grow"></span><button class="btn" type="button" data-act="close">Annuler</button><button class="btn primary" type="button" data-act="dupgo" id="dupGo">Fusionner</button></div>':'');
  $("#scrim").hidden=false;d.hidden=false;dupCount();

function dupCount(){
  if(!DUP)return;const sel=[...document.querySelectorAll("#drawer input[data-dg]:checked")].map(i=>DUP[+i.dataset.dg]);
  const extra=sel.reduce((s,g)=>s+g.length-1,0),after=S.cibles.length-extra;
  const sum=$("#dupSum");if(sum)sum.innerHTML='<div><b>'+sel.length+'</b><span class="sub">client'+(sel.length>1?'s':'')+' à fusionner</span></div><div><b>'+extra+'</b><span class="sub">fiche'+(extra>1?'s':'')+' en trop</span></div><div><b>'+after+'</b><span class="sub">fiche'+(after>1?'s':'')+' après fusion</span></div>';
  const b=$("#dupGo");if(b){b.disabled=!extra;b.textContent=extra?"Fusionner "+pl(extra,"doublon"):"Fusionner"}
}
async function dupGo(){
  if(!DUP)return;const boxes=[...document.querySelectorAll("#drawer input[data-dg]")];
  const sel=boxes.filter(i=>i.checked).map(i=>DUP[+i.dataset.dg]);
  if(!sel.length){toast("Cochez au moins un client.");return}
  const btn=$("#dupGo");btn.disabled=true;btn.textContent="Fusion en cours…";
  const before=[],saves=[],dels=[];
  sel.forEach(g=>{g.forEach(c=>before.push(clone(c)));saves.push(mergeGroup(g));g.slice(1).forEach(c=>{dels.push(c.id);S.actions.forEach(a=>{if(a.cibleId===c.id)a.cibleId=g[0].id})})});
  const keepIgn=boxes.filter(i=>!i.checked).map(i=>dupSig(DUP[+i.dataset.dg]));
  if(!(await bulkApply(saves,dels))){btn.disabled=false;dupCount();return}
  dels.forEach(id=>S.open.delete(id));
  S.settings.dupIgnore=keepIgn;await saveSettings();
  UNDO={before,n:dels.length};DUP=null;closeDrawer();render();
  toast(pl(dels.length,"doublon")+" fusionné"+(dels.length>1?"s":""));
}
async function dupUndo(){
  if(!UNDO)return;const u=UNDO;UNDO=null;
  const ok=await bulkApply(u.before,[]);render();
  toast(ok?"Fusion annulée : "+pl(u.n,"fiche")+" rétablie"+(u.n>1?"s":""):"Annulation impossible pour le moment.");
}


function dupScore(c){
  let n=0;["agence","apporteur","accompagnant","notes","potentiel","motif"].forEach(k=>{if(c[k])n++});
  return (c.opp&&c.opp.creee?1e6:0)+visitsOf(c).length*1e4+(STAGE_RANK[c.etape]||0)*100+n+c.bu.length+c.prestations.length}

/* ---------- Mailing : liste de contacts, case « envoyé », date d'envoi, relance, commentaire ---------- */

  {k:"excl",l:"Exclus",f:m=>/^non/i.test(m.envoyer)},

/* Mails types : {APPEL} et {ACCROCHE} remplacés pour chaque contact */
function mTpl(m){const T=S.settings.mailTypes||[];if(!T.length)return null;const f=nh(m.famille),ty=nh(m.typologie);
  const t=(f&&T.find(x=>nh(x.famille)===f))||(ty&&T.find(x=>(x.typos||[]).some(y=>nh(y)===ty)));if(!t)return null;
  const fill=s=>String(s||"").replace(/\{APPEL\}/g,m.appel||"Bonjour,").replace(/\{ACCROCHE\}/g,m.accroche||"").replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
  return {objet:fill(t.objet),corps:fill(t.corps)}}

const mFold=x=>String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

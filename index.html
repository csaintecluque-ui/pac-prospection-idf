<main id="app">
  <div id="banner" hidden></div>

  <section id="view-tdb"></section>
  <section id="view-agenda" hidden></section>
  <section id="view-comptes" hidden></section>
  <section id="view-compte" hidden></section>
  <section id="view-bilan" hidden></section>
  <section id="view-devis" hidden></section>
  <section id="view-analyse" hidden></section>

  <section id="view-cibles" hidden>
    <div class="page-h"><div class="grow"><span class="crumb">Suivi de prospection</span><h2>Cibles &amp; campagnes</h2><p class="sub" id="cibSub"></p></div>
      <div class="bar">
        <button class="btn ghost" id="btnImport" type="button" title="Importer des clients ou prospects depuis Excel"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 10V2M4.5 5.5 8 2l3.5 3.5M2.5 13.5h11"/></svg>Importer</button>
        <button class="btn ghost" id="btnExport" type="button" title="Exporter les cibles et les actions"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2.5 13.5h11"/></svg>Exporter / Excel</button>
        <button class="btn primary" id="btnNew" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v10M3 8h10"/></svg>Nouvelle cible</button>
      </div>
    </div>
    <div class="camps" id="camps" aria-label="Campagnes"></div>
    <div class="bar"><div class="chips grow" id="views" aria-label="Vues"></div></div>
    <div class="filters">
      <div class="field-s"><label for="q">Rechercher</label><input type="search" id="q" placeholder="Client, contact, apporteur, campagne…"></div>
      <div class="field-s"><label for="fBu">BU d'origine</label><select id="fBu"></select></div>
      <div class="field-s"><label for="fAg">Agence</label><select id="fAg"></select></div>
      <div class="field-s"><label for="fDp">Département</label><select id="fDp"><option value="">Tous</option></select></div>
      <div class="field-s"><label for="fCa">Campagne</label><select id="fCa"><option value="">Toutes</option></select></div>
      <div class="field-s"><label for="fSort">Trier par</label><select id="fSort"><option value="prio">Priorité</option><option value="dept">Département</option><option value="camp">Campagne</option><option value="next">Prochaine action</option><option value="name">Client</option><option value="pot">Potentiel</option></select></div>
      <div class="field-s"><label for="fTy">Type</label><select id="fTy"><option value="">Tous</option><option>Client existant</option><option>Prospect</option><option>Prescripteur</option></select></div>
      <div class="field-s"><label for="fPr">Priorité</label><select id="fPr"><option value="">Toutes</option><option>A</option><option>B</option><option>C</option></select></div>
    </div>
    <div id="exNote" class="notice" hidden></div>
    <div id="dupNote" class="notice warn" role="status" hidden></div>
    <div class="list-wrap" id="listWrap"></div>
  </section>

  <section id="view-mailing" hidden></section>
  <section id="view-pac" hidden></section>
</main>

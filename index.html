<style>
/* Layout : bandeau d'en-tête encre (sceau CSC), onglets Cibles / Tableau de bord, liste dense + fiche cible en panneau latéral. */
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --surface-2:#EFEEEB; --line:#E0DDD7; --fg:#1E1B18; --muted:#69625B;
  --accent:#A35C2A; --accent-ink:#FFFFFF; --accent-soft:#F5E7DB;
  --ink:#1B1512; --copper:#C9804F; --parch:#EAD9B8;
  --ok:#2E7A45; --ok-soft:#E2F0E6; --warn:#9A6200; --warn-soft:#FBEED3; --bad:#B0442D; --bad-soft:#F7E1DA;
  --info:#2A66A8; --info-soft:#E0EAF6; --grey:#6E6862; --grey-soft:#ECEAE6;
  --opp-open:#3A8FD9; --opp-won:#5E9B2A; --opp-lost:#D9733A;
  --shadow:0 12px 40px rgba(27,21,18,.18);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13110F; --surface:#1B1815; --surface-2:#24201C; --line:#36302A; --fg:#EEE9E3; --muted:#A49B91;
  --accent:#DC955F; --accent-ink:#1B1512; --accent-soft:#3A2A1E;
  --ok:#6CC08A; --ok-soft:#1D3325; --warn:#E3AA45; --warn-soft:#382C14; --bad:#E8886F; --bad-soft:#3D221B;
  --info:#7DB2EA; --info-soft:#1B2A3B; --grey:#A49B91; --grey-soft:#2A2622;
  --opp-open:#5BA6E6; --opp-won:#86C24F; --opp-lost:#E8915E; --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13110F; --surface:#1B1815; --surface-2:#24201C; --line:#36302A; --fg:#EEE9E3; --muted:#A49B91;
  --accent:#DC955F; --accent-ink:#1B1512; --accent-soft:#3A2A1E;
  --ok:#6CC08A; --ok-soft:#1D3325; --warn:#E3AA45; --warn-soft:#382C14; --bad:#E8886F; --bad-soft:#3D221B;
  --info:#7DB2EA; --info-soft:#1B2A3B; --grey:#A49B91; --grey-soft:#2A2622;
  --opp-open:#5BA6E6; --opp-won:#86C24F; --opp-lost:#E8915E; --shadow:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
.exout{width:100%;min-height:160px;font:12px/1.4 var(--f-num);white-space:pre}
.notice a{color:var(--accent);font-weight:600}
body{background:var(--bg);color:var(--fg);font:400 14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* En-tête */
.top{background:var(--ink);color:var(--parch)}
.top-in{max-width:1240px;margin:0 auto;padding:14px 20px 0;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{margin:0;font:600 19px/1.15 var(--f-label);letter-spacing:.01em;color:#F3E9D6}
.brand p{margin:2px 0 0;font-size:12.5px;color:#BFAE92}
.brand .grow{flex:1;min-width:0}
.sync{font:500 11.5px var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:#BFAE92;display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:#7E705D;display:inline-block}
.sync[data-s="db"] i,.sync[data-s="local"] i{background:#86C24F}.sync[data-s="warn"] i{background:#E3AA45}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;padding:10px 14px 11px;color:#BFAE92;font:600 13px var(--f-label);letter-spacing:.05em;text-transform:uppercase;border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:#F3E9D6;border-bottom-color:var(--copper)}
.tab:hover{color:#F3E9D6}

main{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:20px 60px;display:flex;flex-direction:column;gap:16px}
.notice{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--muted)}
.notice b{color:var(--fg)}
.notice.warn{border-color:var(--warn);background:var(--warn-soft);color:var(--fg)}

/* Barre d'outils */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar .grow{flex:1}
.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.chip .n{font:500 11.5px var(--f-num);color:var(--muted);background:var(--surface-2);border-radius:999px;padding:0 6px}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip[aria-pressed="true"] .n{background:rgba(127,127,127,.3);color:inherit}

.filters{display:grid;grid-template-columns:minmax(0,1.8fr) repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:1100px){.filters{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.filters .field-s:first-child{grid-column:1/-1}}
.field-s{display:flex;flex-direction:column;gap:3px;min-width:0}
.field-s label,.lbl{font:600 11px var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=email],input[type=tel],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
textarea{resize:vertical;min-height:70px}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}

/* Liste */
.list-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:860px}
th{font:600 11px var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.co{font-weight:600}
.co .ex{font:600 10px var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.sub{color:var(--muted);font-size:12.5px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font:500 11px var(--f-num);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted);white-space:nowrap}
.tag.bu{font-family:var(--f-label);font-size:11.5px;color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font:500 12px var(--f-label);letter-spacing:.02em;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-a_qualifier{background:var(--grey-soft);color:var(--grey)}
.st-cible{background:var(--info-soft);color:var(--info)}
.st-rdv{background:var(--warn-soft);color:var(--warn)}
.st-visite{background:var(--accent-soft);color:var(--accent)}
.st-opportunite{background:var(--info-soft);color:var(--info)}
.st-gagne{background:var(--ok-soft);color:var(--ok)}
.st-sans_suite{background:var(--bad-soft);color:var(--bad)}
.prio{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:5px;font:600 13px var(--f-label)}
.prio-A{background:var(--accent);color:var(--accent-ink)}
.prio-B{background:var(--accent-soft);color:var(--accent)}
.prio-C{background:var(--surface-2);color:var(--muted)}
.late{color:var(--bad);font-weight:600}
.ty{font:600 10.5px var(--f-label);letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:1px 5px;margin-right:4px;background:var(--surface-2);color:var(--muted)}
.ty-pres{background:var(--info-soft);color:var(--info)}.ty-clie{background:var(--ok-soft);color:var(--ok)}
.imp-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.imp-sum div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.imp-sum b{display:block;font:500 20px var(--f-num)}
.imp-prev{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.imp-prev table{min-width:520px}.imp-prev td,.imp-prev th{padding:6px 8px;font-size:12.5px}
.nearl{display:flex;flex-direction:column;gap:8px;border:1px solid var(--info);background:var(--info-soft);border-radius:6px;padding:10px 12px}
.nearl .hint{margin:-4px 0 2px}
.near-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
@media (max-width:520px){.near-r{grid-template-columns:minmax(0,1fr)}}
.radio{display:flex;flex-direction:column;gap:6px}.radio label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}.radio input{accent-color:var(--accent);margin-top:3px}
.empty{padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.empty h3{margin:0;color:var(--fg);font:600 16px var(--f-label)}
.empty p{margin:0;max-width:52ch}

/* Tableau de bord */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font:500 26px/1.1 var(--f-num);font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--muted)}
.meter{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.meter b{display:block;height:100%;background:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{margin:0;font:600 13px var(--f-label);letter-spacing:.06em;text-transform:uppercase}
.panel .cap{font-size:12.5px;color:var(--muted);margin:-6px 0 0}
.panel svg{width:100%;height:auto;display:block}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:13px}
.hbar .t{height:14px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.hbar .t b{display:block;height:100%;border-radius:3px}
.hbars{display:flex;flex-direction:column;gap:7px}
.ratio{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:8px;font-size:13px}
.ratio:first-of-type{border-top:0;padding-top:0}
.obj{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.obj input{width:70px}

/* Panneau fiche */
.scrim{position:fixed;inset:0;background:rgba(15,12,10,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{display:flex;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.dh h2{margin:0;font:600 18px/1.2 var(--f-label);text-wrap:balance}
.dh .grow{flex:1;min-width:0}
.db{flex:1;overflow-y:auto;padding:16px 18px 24px;display:flex;flex-direction:column;gap:18px}
.df{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface)}
.df .grow{flex:1}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font:600 12px var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:0;margin-bottom:10px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.req{color:var(--bad)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 9px;cursor:pointer;font-size:13px}
.checks input{accent-color:var(--accent);margin:0}
.checks label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;width:max-content}
.seg button{border:0;background:var(--surface);padding:6px 14px;cursor:pointer;font:600 13px var(--f-label);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.steps{display:flex;flex-wrap:wrap;gap:4px}
.steps button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font:500 12.5px var(--f-label);cursor:pointer;color:var(--muted)}
.steps button.done{color:var(--fg);border-color:var(--muted)}
.steps button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.visit{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.visit .vh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.visit .vh .grow{flex:1}
.visit p{margin:0;white-space:pre-wrap;font-size:13.5px}
.vs-Planifiée{background:var(--warn-soft);color:var(--warn)}
.vs-Réalisée{background:var(--ok-soft);color:var(--ok)}
.vs-Annulée{background:var(--grey-soft);color:var(--grey)}
.addv{border:1px dashed var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px}
/* Fiche cible élargie : deux colonnes, suivi des échanges à droite */
.drawer.wide{width:min(1240px,100%)}
.fgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:28px;align-items:start}
.fcol{display:flex;flex-direction:column;gap:22px;min-width:0}
@media (max-width:980px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.ech{display:flex;flex-direction:column;gap:10px;min-width:0}
.ech-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.ech-h .leg{font:600 12px var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.echips .chip{padding:3px 9px;font-size:12.5px}
.eform{background:var(--surface);border-style:solid}
.elist{display:flex;flex-direction:column;gap:8px}
.ecard{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.eh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.eh .grow{flex:1;min-width:0}
.eic{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-2);color:var(--muted);flex:none}
.eic svg{width:13px;height:13px}
.eic-appel{background:var(--info-soft);color:var(--info)}.eic-mail{background:var(--accent-soft);color:var(--accent)}.eic-visite,.eic-visio{background:var(--ok-soft);color:var(--ok)}
.eobj{font-weight:600;overflow-wrap:anywhere}
.edet{margin:0;white-space:pre-wrap;font-size:13.5px;overflow-wrap:anywhere}
.tone-ok{background:var(--ok-soft);color:var(--ok)}.tone-warn{background:var(--warn-soft);color:var(--warn)}.tone-info{background:var(--info-soft);color:var(--info)}.tone-grey{background:var(--grey-soft);color:var(--grey)}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.nudge{animation:nudge .25s 2}
/* Mailing */
.mtab{min-width:1080px}
.mtab tbody tr{cursor:default}
.mtab tbody tr:hover td{background:none}
.mtab td{vertical-align:middle;padding:8px 10px}
.mtab tr.msent td:first-child{background:var(--ok-soft)}
.mtab input[type=date]{width:142px;padding:5px 7px}
.mtab input[type=text]{min-width:210px;padding:5px 8px}
.mck{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font:600 12px var(--f-label);letter-spacing:.02em;white-space:nowrap;color:var(--muted)}
.mck input{width:18px;height:18px;accent-color:var(--ok);margin:0;cursor:pointer}
.msent .mck{color:var(--ok)}
.mflag{display:inline-block;margin-top:4px;font-size:11.5px;line-height:1.35;color:var(--grey);background:var(--grey-soft);border-radius:4px;padding:1px 6px;max-width:320px}
.mflag.warn{color:var(--warn);background:var(--warn-soft)}
.mtab input.mlate{border-color:var(--bad);color:var(--bad);font-weight:600}
.mact{white-space:nowrap;text-align:right}.mact .btn{padding:5px 9px;margin-left:4px}
.mtab .dl{font-size:12.5px;overflow-wrap:anywhere}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}
.toggle input{accent-color:var(--accent);width:16px;height:16px;margin:0}

.tg{width:34px;padding-right:0!important}
th.tg{padding:6px 0 6px 8px!important}
.tgb{display:inline-grid;place-items:center;width:26px;height:26px;border:1px solid transparent;border-radius:6px;background:none;color:var(--muted);cursor:pointer;padding:0}
.tgb:hover{border-color:var(--line);background:var(--surface);color:var(--fg)}
.tgb svg{width:14px;height:14px;transition:transform .15s ease}
.tgb[aria-expanded="true"] svg{transform:rotate(90deg)}
.tgb.has{color:var(--accent)}
tbody tr.open td{background:var(--accent-soft);border-bottom-color:transparent}
tbody tr.open:hover td{background:var(--accent-soft)}
tr.det{cursor:default}
tr.det td,tr.det:hover td{background:var(--surface);padding:0 12px 14px 46px;border-bottom:1px solid var(--line);box-shadow:inset 3px 0 0 var(--accent)}
.det-in{position:sticky;left:46px;max-width:min(100%,calc(100vw - 80px));display:grid;grid-template-columns:minmax(190px,1fr) minmax(0,2fr) minmax(220px,1.3fr);gap:12px 22px;padding-top:12px;border-top:1px dashed var(--line)}
.dcol{display:flex;flex-direction:column;gap:4px;min-width:0}
.dcol .lbl{margin-bottom:2px}
.dl{color:var(--accent);text-decoration:none;font-size:13px;display:inline-flex;align-items:center;gap:6px;overflow-wrap:anywhere}
.dl:hover{text-decoration:underline}
.dl svg{width:13px;height:13px;flex:none}
.kv{font-size:12.5px;color:var(--muted)}.kv b{font-weight:500;color:var(--fg)}
.dnotes{margin:0;white-space:pre-line;overflow-wrap:anywhere;font-size:13.5px;line-height:1.5}
.dv{font-size:12.5px;border-left:2px solid var(--line);padding:1px 0 1px 8px}
.dv p{margin:2px 0 0;white-space:pre-line;color:var(--fg)}
.dact{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:860px){.det-in{grid-template-columns:minmax(0,1fr);max-width:calc(100vw - 92px)}}

.cpl{display:flex;flex-direction:column;gap:6px}
.cpl label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;cursor:pointer;font-size:13.5px}
.cpl label.dis{opacity:.55;cursor:default}
.cpl input{accent-color:var(--accent);margin:0;flex:none}
.cpl .grow{min-width:0}
.cpl label.dupg{align-items:flex-start}
.cpl label.dupg input{margin-top:3px}
.dupr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:5px}
.keep,.gone{font:600 10.5px var(--f-label);letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 6px}
.keep{background:var(--ok-soft);color:var(--ok)}.gone{background:var(--bad-soft);color:var(--bad)}
#dupNote{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}#dupNote[hidden]{display:none}
#dupNote .btn{padding:4px 10px}
.sib{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.sib button{font:500 11.5px var(--f-ui);border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:4px;padding:1px 6px;cursor:pointer}
.sib button:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- PAC ---------- */
body.tab-pac main{max-width:1840px}
.pac-head{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.pac-head h2{margin:2px 0 0;font:600 21px/1.2 var(--f-label);letter-spacing:.01em}
.pac-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table.pac{min-width:1700px;table-layout:fixed}
table.pac th{white-space:normal;text-align:center;vertical-align:middle;padding:8px 8px;border-left:1px solid var(--line);font-size:10.5px}
table.pac thead tr:first-child th{background:var(--ink);color:var(--parch);border-left-color:#3A302A;border-bottom-color:#3A302A}
table.pac thead tr:nth-child(2) th{border-bottom:2px solid var(--copper)}
table.pac td{font-size:13px;line-height:1.45;padding:9px 9px;border-left:1px solid var(--line);white-space:pre-line;overflow-wrap:anywhere}
table.pac th:first-child,table.pac td:first-child{border-left:0}
table.pac .stk{position:sticky;left:0;z-index:1}
table.pac td.stk{background:var(--surface);font-weight:600;box-shadow:inset -1px 0 0 var(--line)}
table.pac th.cur{background:var(--accent);color:var(--accent-ink)}
table.pac td.cur{background:var(--accent-soft)}
table.pac tbody tr:hover td.cur{background:var(--accent-soft)}
.decs{display:flex;flex-direction:column;gap:3px;white-space:normal}
.dec{font:500 11.5px var(--f-ui);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:4px;padding:2px 7px;cursor:pointer;text-align:left}
.dec:hover:not(:disabled){border-color:var(--muted);color:var(--fg)}
.dec:disabled{cursor:default}
.dec[aria-pressed="true"]{font-weight:600}
.dec.dc-ok[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.dec.dc-warn[aria-pressed="true"]{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.dec.dc-info[aria-pressed="true"]{background:var(--info-soft);color:var(--info);border-color:var(--info)}
.dec.dc-bad[aria-pressed="true"]{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.pks{white-space:normal;margin-bottom:4px}
.pk{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.pk b{color:var(--fg);font:500 12px var(--f-num);white-space:nowrap}
.pbar{height:4px;background:var(--surface-2);border-radius:2px;margin:2px 0 5px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.pbar i.ok{background:var(--ok)}
.pcamp{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:normal}
.ml{white-space:normal;padding-left:10px;text-indent:-10px;margin-bottom:4px}.ml::before{content:"• ";color:var(--accent)}
.pacts{margin-top:6px;font-size:12px;color:var(--muted)}
.pimp{margin:0;padding-left:20px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.pel{display:flex;gap:8px;align-items:flex-start}
.pel>span{min-width:0}
button.prio{flex:none;width:30px;border:0;cursor:pointer;font-size:12px;padding:0}
button.prio:disabled{cursor:default}
button.prio:hover:not(:disabled){outline:2px solid var(--accent);outline-offset:1px}
.prio-0{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.pac-filt{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pac-filt .ps{display:flex;align-items:center;gap:8px}
.pac-filt .ps label{font:600 11px var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pac-filt select{width:auto}
.pac-link{display:flex;justify-content:center;padding:4px 0}
.pac-date{display:none}

  body.print-pac table.pac col:nth-child(5){width:7%!important}
  body.print-pac table.pac col:nth-child(6){width:7%!important}
  body.print-pac table.pac col:nth-child(7){width:7%!important}
  body.print-pac table.pac col:nth-child(8){width:6.5%!important}
  body.print-pac table.pac col:nth-child(9){width:5%!important}
  body.print-pac table.pac col:nth-child(10){width:8%!important}
  body.print-pac table.pac col:nth-child(11){width:7%!important}

  body.print-pac table.pac col:nth-child(13){width:6%!important}
  body.print-pac table.pac th{overflow-wrap:break-word}
  body.print-pac .dec[aria-pressed="false"]{display:none}
  body.print-pac .decs{align-items:flex-start}
  body.print-pac table.pac td{font-size:7.5pt;padding:4px 5px}
  body.print-pac table.pac th{font-size:7pt;padding:4px 4px}
  body.print-pac table.pac .stk{position:static}
  body.print-pac .dec{font-size:6.5pt;padding:1px 3px;white-space:nowrap}
  body.print-pac .pk,body.print-pac .pk b{font-size:7pt}
  body.print-pac .pac-filt{display:none!important}
  body.print-pac button.prio{width:22px;height:18px;font-size:7pt}
  body.print-pac .pcamp{font-size:6.5pt}
  body.print-pac tr{break-inside:avoid}
  body.print-pac thead{display:table-header-group}
}

(function(){
"use strict";

/* ---------- Référentiels ---------- */
const STAGES=[
  {k:"a_qualifier",l:"À qualifier"},{k:"cible",l:"Ciblé"},{k:"rdv",l:"RDV pris"},
  {k:"visite",l:"Visité"},{k:"opportunite",l:"Opportunité créée"},{k:"gagne",l:"Gagné"},{k:"sans_suite",l:"Sans suite"}];
const SL=Object.fromEntries(STAGES.map(s=>[s.k,s.l]));
const SIDX=Object.fromEntries(STAGES.map((s,i)=>[s.k,i]));
const BUS=["Construction","Équipements","Environnement","Infrastructures","Autre BU"];
const SEGMENTS=["Industriel","Logistique / entrepôts","Tertiaire / bureaux","Bailleur social","Foncière / investisseur","Promoteur","Syndic / administrateur de biens","Property / facility management","Collectivité / établissement public","Maîtrise d'œuvre / architecte / BET","Entreprise de travaux (prescripteur)","Expert d'assurance / après sinistre","Autre"];
const PRESTA=[["AMI","Amiante"],["CREP","Plomb"],["DPE","DPE / audit énergétique"],["GAZ","Gaz"],["ÉLEC","Électricité"],["TERM","Termites"],["PEMD","PEMD (avant démolition)"],["VENTE","Avant vente / relocation"],["AUTRE","Autre"]];
const PLABEL=Object.fromEntries(PRESTA);
const SOURCES=["Autre BU","Café Commerce","Réunion inter-BU","Événement client","Prospection directe","Lead Athena"];
const MOTIFS=["Accord-cadre concurrent","Pas de besoin","Prix","Pas de réponse","Autre"];
const VSTAT=["Planifiée","Réalisée","Annulée"];
const OSTAT=["Ouvert","Conclue","Perdu"];
const TYPES=["Client existant","Prospect","Prescripteur"];
const DEPTS=[["75","Paris"],["77","Seine-et-Marne"],["78","Yvelines"],["91","Essonne"],["92","Hauts-de-Seine"],["93","Seine-Saint-Denis"],["94","Val-de-Marne"],["95","Val-d'Oise"]];
const DNAME=Object.fromEntries(DEPTS);const dLabel=d=>d?(DNAME[d]?d+" · "+DNAME[d]:d):"";
const CAMPAGNE_DEF="PAC IDF – Clients autres BU – T4 2026";

/* ---------- Utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const addDaysISO=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};

const eur=n=>(Number(n)||0).toLocaleString("fr-FR",{maximumFractionDigits:0})+" €";

function blank(){
  return {compte:"",type:"Prospect",dept:"",contact:"",fonction:"",tel:"",mail:"",campagne:CAMPAGNE_DEF,source:"Autre BU",bu:[],apporteur:"",
    segment:"",prestations:[],potentiel:"",priorite:"B",etape:"a_qualifier",agence:"",accompagnant:"",
    prochaineAction:"",prochaineLibelle:"",motif:"",notes:"",visites:[],echanges:[],opp:{creee:false,montant:"",statut:"Ouvert",devis:"",date:""}};
}
function guessDept(c){
  const nx=x=>String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  const camp=nx(c.campagne);for(const [code,name] of DEPTS){if(camp.includes(nx(name)))return code}
  const m=String(c.notes||"").match(/(?:Site|Siège)\s*:[^·]*?\b(7[5789]|9[1-5])\d{3}\b/);if(m)return m[1];
  const m2=String(c.notes||"").match(/\b(7[5789]|9[1-5])\d{3}\b/);if(m2)return m2[1];
  return ""}
function norm(c){const b=blank();const o=Object.assign(b,c||{});o.opp=Object.assign(blank().opp,(c&&c.opp)||{});
  o.bu=Array.isArray(o.bu)?o.bu:[];o.prestations=Array.isArray(o.prestations)?o.prestations:[];o.visites=Array.isArray(o.visites)?o.visites:[];o.echanges=Array.isArray(o.echanges)?o.echanges:[];o.leadIds=Array.isArray(o.leadIds)?o.leadIds:[];
  if(!SIDX.hasOwnProperty(o.etape))o.etape="a_qualifier";if(!o.dept)o.dept=guessDept(o);return o}

/* ---------- Persistance ---------- */
function setSync(mode,txt){S.mode=mode;$("#sync").dataset.s=mode;$("#syncTxt").textContent=txt}
function lsLoad(){try{const r=JSON.parse(localStorage.getItem(LS_KEY)||"null");if(r){S.cibles=(r.cibles||[]).map(norm);S.pac=(r.pac||[]).map(pnorm);S.mailing=(r.mailing||[]).map(mnorm);S.settings=Object.assign({objectif:8},r.settings||{})}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS_KEY,JSON.stringify({cibles:S.cibles,pac:S.pac,mailing:S.mailing,settings:S.settings}))}catch(e){toast("Enregistrement local impossible dans ce navigateur.")}}

async function saveCible(c){
  c.majLe=new Date().toISOString();
  if(S.mode==="db"){
    const {id,...body}=c;
    try{await S.db.collection("cibles").doc(id).set(JSON.parse(JSON.stringify(body)));return true}
    catch(e){return dbErr(e)}
  }
  const i=S.cibles.findIndex(x=>x.id===c.id);if(i>=0)S.cibles[i]=c;else S.cibles.push(c);lsSave();render();return true;
}
async function deleteCible(id){
  if(S.mode==="db"){try{await S.db.collection("cibles").doc(id).delete();return true}catch(e){return dbErr(e)}}
  S.cibles=S.cibles.filter(x=>x.id!==id);lsSave();render();return true;
}
async function saveSettings(){
  if(S.mode==="db"){try{await S.db.doc("config/settings").set(S.settings)}catch(e){dbErr(e)}}else lsSave();
}
function dbErr(e){
  const code=e&&e.code;
  if(code==="invalid_argument"&&!S.writable){toast("Lecture seule : seul le propriétaire modifie les cibles.")}
  else if(code==="invalid_argument"){S.writable=false;applyRO();toast("Modification refusée : cette page est en lecture seule pour vous.")}
  else if(code==="quota_exceeded")toast("Capacité de stockage atteinte : supprimez des cibles closes puis réessayez.");
  else toast("Enregistrement impossible pour le moment. Réessayez dans un instant.");
  return false;
}
function applyRO(){document.body.classList.toggle("ro",!S.writable)}

async function init(){
  render();
  let db=null,user=null;
  try{if(window.claude&&window.claude.use){[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    window.claude.use("downloads").then(d=>{S.downloads=d}).catch(()=>{});}}catch(e){db=null}
  if(db){
    S.db=db;
    if(user){try{const own=await user.isOwner();const can=await user.can("data.write");S.writable=!!own||can===true||can==null}catch(e){}}
    applyRO();
    setSync("db","Synchronisé");
    db.collection("cibles").onSnapshot(snap=>{
      S.cibles=snap.docs.map(d=>Object.assign(norm(d.data()),{id:d.id}));render();
    },()=>{setSync("local","Hors ligne");toast("Connexion aux données perdue. Rechargez la page.")});
    db.doc("config/settings").onSnapshot(s=>{if(s.exists){S.settings=Object.assign({objectif:8},s.data());if(S.tab==="tdb")renderTdb();if(S.tab==="pac")renderPac()}seedState.set=true;maybePacSeed()},()=>{});
    db.collection("pac").onSnapshot(snap=>{S.pac=snap.docs.map(d=>Object.assign(pnorm(d.data()),{id:d.id}));if(S.tab==="pac")renderPac();seedState.pac=true;maybePacSeed()},()=>{});
    db.collection("mailing").onSnapshot(snap=>{S.mailing=snap.docs.map(d=>Object.assign(mnorm(d.data()),{id:d.id}));if(S.tab==="mailing"){renderMKpis();if(!document.activeElement||!document.activeElement.closest("#view-mailing"))renderMailing()}},()=>{});
  }else{
    lsLoad();
    let ok=true;try{localStorage.setItem("pac-idf-test","1");localStorage.removeItem("pac-idf-test")}catch(e){ok=false}
    const b=$("#banner");b.hidden=false;
    if(!ok){setSync("warn","Non enregistré");b.className="notice warn";
      b.innerHTML="<b>Enregistrement bloqué.</b> Ce navigateur n'autorise pas l'enregistrement dans ce cadre : les saisies seront perdues à la fermeture. <a href=\""+location.href.split("#")[0]+"\" target=\"_blank\" rel=\"noopener\">Ouvrir l'application dans un onglet</a>.";}
    else{setSync("local","Enregistré sur ce poste");b.className="notice";
      b.innerHTML=IN_FRAME?"<b>Vos cibles sont enregistrées sur ce poste, dans Notion.</b> Utilisez toujours l'application ici : un onglet séparé ne voit pas les mêmes données. Faites une sauvegarde chaque semaine (Exporter, puis Sauvegarde complète).":"<b>Vos cibles sont enregistrées sur ce poste, dans ce navigateur.</b> Faites une sauvegarde chaque semaine (Exporter, puis Sauvegarde complète).";}
    render();
    maybePacSeed();
  }
}

const startOfWeek=()=>{const d=new Date();const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const VIEWS=[
  {k:"actives",l:"Cibles actives",f:c=>isActive(c)},
  {k:"prioA",l:"Priorité A sans RDV",f:c=>c.priorite==="A"&&(c.etape==="a_qualifier"||c.etape==="cible")},
  {k:"relance",l:"À relancer",f:c=>isActive(c)&&c.prochaineAction&&c.prochaineAction<=todayISO()},
  {k:"visites",l:"Visites à venir (7 j)",f:c=>c.visites.some(v=>v.statut==="Planifiée"&&v.date>=todayISO()&&v.date<=addDaysISO(7))},
  {k:"closes",l:"Clôturées",f:c=>!isActive(c)},
  {k:"toutes",l:"Toutes",f:()=>true}];

function filtered(){
  const v=VIEWS.find(x=>x.k===S.view)||VIEWS[0];
  const q=$("#q").value.trim().toLowerCase(),bu=$("#fBu").value,ag=$("#fAg").value,pr=$("#fPr").value;
  return S.cibles.filter(v.f).filter(c=>{
    if(bu&&!c.bu.includes(bu))return false;
    if(ag&&c.agence!==ag)return false;
    if(pr&&c.priorite!==pr)return false;
    const ty=$("#fTy").value;if(ty&&c.type!==ty)return false;
    const ca=$("#fCa").value;if(ca==="__"?!!c.campagne:(ca&&c.campagne!==ca))return false;
    const dp=$("#fDp").value;if(dp==="__"?!!c.dept:(dp&&c.dept!==dp))return false;
    if(q){const h=[c.compte,c.contact,c.apporteur,c.campagne,c.agence,c.notes].join(" ").toLowerCase();if(!h.includes(q))return false}
    return true;
  }).sort((a,b)=>{const k=$("#fSort").value;
    const byP=(a.priorite||"Z").localeCompare(b.priorite||"Z"),byN=(a.prochaineAction||"9999").localeCompare(b.prochaineAction||"9999"),byC=a.compte.localeCompare(b.compte,"fr");
    if(k==="dept")return (a.dept||"99").localeCompare(b.dept||"99")||byP||byC;
    if(k==="camp")return (a.campagne||"~").localeCompare(b.campagne||"~","fr")||(a.dept||"99").localeCompare(b.dept||"99")||byP||byC;
    if(k==="next")return byN||byP||byC;
    if(k==="name")return byC;
    if(k==="pot")return (Number(b.potentiel)||0)-(Number(a.potentiel)||0)||byP||byC;
    return byP||byN||byC});
}

/* ---------- PAC : plan d'action commercial (format PAC France : élément, objectif, actions T1-T4, suivi, résultats, correctif) ---------- */
const PDEC=[["Continuer","ok"],["Modifier","warn"],["Reporter","info"],["Arrêter","bad"]];
const PAC_TITRE_DEF="Plan d'action commercial Diagnostic – Île-de-France";
let P=null,pIsNew=false,pDelArmed=false,PIMP=null;
const PPRIO=[["1","P1","Haute"],["2","P2","Moyenne"],["3","P3","Basse"]],PCLS={"1":"A","2":"B","3":"C"};
const toPrio=v=>{const n=nh(v);if(/^p ?1$|haute|forte|elevee/.test(n))return "1";if(/^p ?2$|moyenne|normale/.test(n))return "2";if(/^p ?3$|basse|faible/.test(n))return "3";return ""};
const prioLbl=k=>{const x=PPRIO.find(y=>y[0]===k);return x?x[1]+" · "+x[2].toLowerCase():"Sans priorité"};
function pblank(){return {prio:"",element:"",objectif:"",descriptif:"",actions:"",t1:"",t2:"",t3:"",t4:"",qui:"",quand:"",kpi:"",attendus:"",obtenus:"",decision:"",campagnes:[],obj:{visites:"",opps:"",devis:"",ca:""},ordre:0}}
function pnorm(x){const o=Object.assign(pblank(),x||{});o.obj=Object.assign(pblank().obj,(x&&x.obj)||{});
  o.campagnes=Array.isArray(o.campagnes)?o.campagnes:[];if(!PDEC.some(d=>d[0]===o.decision))o.decision="";o.ordre=Number(o.ordre)||0;o.prio=PCLS[String(o.prio)]?String(o.prio):"";return o}
const pacSorted=()=>S.pac.slice().sort((a,b)=>a.ordre-b.ordre||(a.creeLe||"").localeCompare(b.creeLe||""));

const PAC_COLS=[[/^priorite|^prio/,"prio"],[/^plan d action$/,"pa"],[/^elements?$/,"el"],[/^objectifs?$/,"objectif"],[/^descriptif/,"descriptif"],[/^actions?$/,"actions"],
  [/^(trimestre|t) ?1$/,"t1"],[/^(trimestre|t) ?2$/,"t2"],[/^(trimestre|t) ?3$/,"t3"],[/^(trimestre|t) ?4$/,"t4"],
  [/^qui/,"qui"],[/^quand/,"quand"],[/indicateur|kpi/,"kpi"],[/^resultats? attendus?/,"attendus"],[/^resultats?( obtenus?)?$/,"obtenus"],
  [/^continuer$/,"d:Continuer"],[/^modifier$/,"d:Modifier"],[/^reporter$/,"d:Reporter"],[/^arreter$/,"d:Arrêter"]];
const pacCol=n=>{const h=PAC_COLS.find(([re])=>re.test(n));return h?h[1]:null};
async function parsePacFile(file){
  await loadExcel();const wb=new ExcelJS.Workbook();await wb.xlsx.load(await file.arrayBuffer());
  const sheets=[];
  wb.worksheets.forEach(ws=>{if(ws.state==="hidden")return;
    const txt=(r,c)=>{const v=cellVal(ws.getRow(r).getCell(c).value);return v instanceof Date?fdate(toISO(v)):String(v==null?"":v).trim()};
    const maxC=Math.min(ws.columnCount||0,40),maxR=ws.rowCount||0;let hr=0;
    for(let r=1;r<=Math.min(maxR,15)&&!hr;r++)for(let c=1;c<=maxC;c++){if(/^objectifs?$/.test(nh(txt(r,c)))){hr=r;break}}
    if(!hr)return;
    const subRow=r=>{let k=0;for(let c=1;c<=maxC;c++){const f=pacCol(nh(txt(r,c)));if(f&&/^(t\d|qui|quand|kpi|d:|attendus)/.test(f))k++}return k>=2};
    const sub=hr<maxR&&subRow(hr+1)?hr+1:0;
    const map={};for(let c=1;c<=maxC;c++){const a=nh(txt(hr,c)),b=sub?nh(txt(sub,c)):"";const f=(b&&b!==a&&pacCol(b))||pacCol(a);if(f&&!Object.values(map).includes(f))map[c]=f}
    const recs=[];
    for(let r=(sub||hr)+1;r<=maxR;r++){const o={};let any=false;
      Object.entries(map).forEach(([c,f])=>{const v=txt(r,+c);if(!v)return;any=true;if(f.startsWith("d:"))o.decision=f.slice(2);else o[f]=v});
      if(!any)continue;
      const p=pblank();
      if(o.pa&&o.el){p.element=o.pa;p.objectif=o.el;p.descriptif=[o.objectif,o.descriptif].filter(Boolean).join("\n")}
      else{p.element=o.pa||o.el||"";p.objectif=o.objectif||"";p.descriptif=o.descriptif||""}
      ["actions","t1","t2","t3","t4","qui","quand","kpi","attendus","obtenus","decision"].forEach(k=>{if(o[k])p[k]=o[k]});if(o.prio)p.prio=toPrio(o.prio);
      if(!p.element&&!p.objectif)continue;if(!p.element){p.element=p.objectif;p.objectif=""}
      recs.push(p)}
    if(recs.length)sheets.push({name:ws.name,recs,filled:recs.reduce((s,p)=>s+["objectif","descriptif","actions","t1","t2","t3","t4","qui","quand","kpi","attendus"].filter(k=>p[k]).length,0)});
  });
  if(!sheets.length)throw new Error("none");
  sheets.sort((a,b)=>b.filled-a.filled);return {sheets,pick:0};
}

function monthsBack(n){const out=[];const d=new Date();d.setDate(1);for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push({k:x.getFullYear()+"-"+pad(x.getMonth()+1),l:x.toLocaleDateString("fr-FR",{month:"short"}).replace(".","")+" "+String(x.getFullYear()).slice(2)})}return out}

function renderTdb(){
  const el=$("#view-tdb");const C=S.cibles;
  const visits=[];C.forEach(c=>c.visites.forEach(v=>visits.push({c,v})));
  const done=visits.filter(x=>x.v.statut==="Réalisée");
  const mk=todayISO().slice(0,7);
  const doneMonth=done.filter(x=>(x.v.date||"").slice(0,7)===mk).length;
  const obj=Number(S.settings.objectif)||0;
  const opps=C.filter(c=>c.opp&&c.opp.creee);
  const won=opps.filter(c=>c.opp.statut==="Conclue");
  const caWon=won.reduce((s,c)=>s+(Number(c.opp.montant)||0),0);
  const visited=C.filter(c=>c.visites.some(v=>v.statut==="Réalisée"));
  const visitedWithOpp=visited.filter(c=>c.opp.creee).length;
  const pct=(a,b)=>b?Math.round(a/b*100)+" %":"—";

  // Visites par mois
  const months=monthsBack(6);
  const perM=months.map(m=>done.filter(x=>(x.v.date||"").slice(0,7)===m.k).length);
  const maxV=Math.max(obj,...perM,4);
  const W=560,H=210,pl=30,pr=10,pt=18,pb=28,iw=W-pl-pr,ih=H-pt-pb,bw=iw/months.length;
  const y=v=>pt+ih-(v/maxV)*ih;
  const ticks=[];const step=Math.max(1,Math.ceil(maxV/4));for(let t=0;t<=maxV;t+=step)ticks.push(t);
  let svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Visites réalisées par mois">';
  ticks.forEach(t=>{svg+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-6)+'" y="'+(y(t)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">'+t+'</text>'});
  perM.forEach((v,i)=>{const x=pl+i*bw+bw*.22,w=bw*.56,cur=months[i].k===mk;
    svg+='<rect x="'+x+'" y="'+y(v)+'" width="'+w+'" height="'+Math.max(0,pt+ih-y(v))+'" rx="3" fill="'+(cur?'var(--accent)':'var(--copper)')+'" opacity="'+(cur?1:.55)+'"/>';
    svg+='<text x="'+(x+w/2)+'" y="'+(y(v)-5)+'" text-anchor="middle" font-size="11.5" fill="var(--fg)" font-family="IBM Plex Mono,monospace">'+v+'</text>';
    svg+='<text x="'+(x+w/2)+'" y="'+(H-9)+'" text-anchor="middle" font-size="11.5" fill="var(--muted)" font-family="IBM Plex Sans Condensed,sans-serif">'+esc(months[i].l)+'</text>'});
  if(obj){svg+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(obj)+'" y2="'+y(obj)+'" stroke="var(--fg)" stroke-dasharray="5 4" stroke-width="1.3"/><text x="'+(W-pr)+'" y="'+(y(obj)-5)+'" text-anchor="end" font-size="11" fill="var(--fg)" font-family="IBM Plex Sans Condensed,sans-serif">Objectif '+obj+'</text>'}
  svg+='</svg>';

  // Étapes
  const byStage=STAGES.map(s=>({s,n:C.filter(c=>c.etape===s.k).length}));
  const maxS=Math.max(1,...byStage.map(x=>x.n));
  const colorFor={a_qualifier:"var(--grey)",cible:"var(--info)",rdv:"var(--warn)",visite:"var(--accent)",opportunite:"var(--opp-open)",gagne:"var(--ok)",sans_suite:"var(--bad)"};
  const stageBars=byStage.map(x=>'<div class="hbar"><span>'+esc(x.s.l)+'</span><span class="t"><b style="width:'+(x.n/maxS*100)+'%;background:'+colorFor[x.s.k]+'"></b></span><span class="num r" style="text-align:right">'+x.n+'</span></div>').join("");

  // Visites par BU
  const buCount=BUS.map(b=>({b,n:done.filter(x=>x.c.bu.includes(b)).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
  const maxB=Math.max(1,...buCount.map(x=>x.n));
  const buBars=buCount.length?buCount.map(x=>'<div class="hbar"><span>'+esc(x.b)+'</span><span class="t"><b style="width:'+(x.n/maxB*100)+'%;background:var(--accent)"></b></span><span class="num" style="text-align:right">'+x.n+'</span></div>').join(""):'<p class="hint">Aucune visite réalisée pour l\'instant.</p>';

  // Opportunités par statut
  const oc={Ouvert:"var(--opp-open)",Conclue:"var(--opp-won)",Perdu:"var(--opp-lost)"};
  const oStat=OSTAT.map(s=>({s,n:opps.filter(c=>c.opp.statut===s).length,m:opps.filter(c=>c.opp.statut===s).reduce((a,c)=>a+(Number(c.opp.montant)||0),0)}));
  const maxO=Math.max(1,...oStat.map(x=>x.m));
  const oppBars=opps.length?oStat.map(x=>'<div class="hbar"><span>'+(x.s==="Ouvert"?"Ouvert(e)":x.s)+' <span class="sub num">('+x.n+')</span></span><span class="t"><b style="width:'+(x.m/maxO*100)+'%;background:'+oc[x.s]+'"></b></span><span class="num" style="text-align:right;white-space:nowrap">'+Math.round(x.m/1000)+' k€</span></div>').join(""):'<p class="hint">Aucune opportunité créée depuis une cible.</p>';

  el.innerHTML=
  '<div class="kpis">'+
    '<div class="kpi"><span class="lbl">Cibles actives</span><span class="v">'+C.filter(isActive).length+'</span><span class="d">'+C.filter(c=>isActive(c)&&c.priorite==="A").length+' en priorité A</span></div>'+
    '<div class="kpi"><span class="lbl">Visites ce mois</span><span class="v">'+doneMonth+(obj?'<span style="font-size:15px;color:var(--muted)"> / '+obj+'</span>':'')+'</span><div class="meter"><b style="width:'+(obj?Math.min(100,doneMonth/obj*100):0)+'%"></b></div></div>'+
    '<div class="kpi"><span class="lbl">Opportunités PAC</span><span class="v">'+opps.length+'</span><span class="d">'+eur(opps.filter(c=>c.opp.statut==="Ouvert").reduce((s,c)=>s+(Number(c.opp.montant)||0),0))+' en cours</span></div>'+
    '<div class="kpi"><span class="lbl">CA conclu</span><span class="v">'+eur(caWon)+'</span><span class="d">'+won.length+' affaire'+(won.length>1?'s':'')+' gagnée'+(won.length>1?'s':'')+'</span></div>'+
  '</div>'+
  '<div class="grid2">'+
    '<div class="panel"><div class="bar"><h2 class="grow">Visites réalisées par mois</h2><label class="obj edit-only" for="objIn">Objectif mensuel <input type="number" min="0" step="1" id="objIn" class="num" value="'+esc(obj)+'"></label></div>'+svg+'</div>'+
    '<div class="panel"><h2>Cibles par étape</h2><div class="hbars">'+stageBars+'</div></div>'+
    '<div class="panel"><h2>Visites par BU d\'origine</h2><p class="cap">Visites réalisées, une cible pouvant venir de plusieurs BU.</p><div class="hbars">'+buBars+'</div></div>'+
    '<div class="panel"><h2>Opportunités issues du PAC</h2><p class="cap">Montant estimé par statut, comme dans le TDB Athena.</p><div class="hbars">'+oppBars+'</div></div>'+
  '</div>'+
  '<div class="panel"><h2>Taux de transformation</h2>'+
    '<div class="ratio"><span>Cibles visitées → opportunité créée</span><span class="num">'+pct(visitedWithOpp,visited.length)+' <span class="sub">('+visitedWithOpp+' / '+visited.length+')</span></span></div>'+
    '<div class="ratio"><span>Opportunités conclues / créées</span><span class="num">'+pct(won.length,opps.length)+' <span class="sub">('+won.length+' / '+opps.length+')</span></span></div>'+
    '<div class="ratio"><span>Visites réalisées au total</span><span class="num">'+done.length+'</span></div>'+
    '<div class="ratio"><span>Appels, mails et autres échanges ce mois</span><span class="num">'+C.reduce((s,c)=>s+c.echanges.filter(e=>(e.date||"").slice(0,7)===mk&&!/^(Planifi|Annul|À faire)/.test(e.resultat||"")).length,0)+'</span></div>'+
  '</div>';
  const oi=$("#objIn");if(oi)oi.addEventListener("change",()=>{S.settings.objectif=Math.max(0,parseInt(oi.value,10)||0);saveSettings();renderTdb()});
}

function timeline(c){
  const a=c.visites.map(v=>({k:"v",id:v.id,type:"visite",date:v.date||"",resultat:v.statut||"",interlocuteur:v.interlocuteur||"",objet:v.objet||"",details:v.cr||"",accompagnant:v.accompagnant||"",suite:v.suite||"",relance:v.relance||""}));
  const b=(c.echanges||[]).map(e=>Object.assign({k:"e",interlocuteur:"",objet:"",details:"",accompagnant:"",suite:"",relance:""},e));
  return a.concat(b).sort((x,y)=>(y.date||"").localeCompare(x.date||"")||String(y.id).localeCompare(String(x.id)));
}
function lastContact(c){const t=todayISO();const d=timeline(c).filter(x=>x.date&&x.date<=t&&!/^(Planifi|Annul|À faire|Pas de réponse|Sans réponse)/.test(x.resultat)).map(x=>x.date).sort();return d.length?d[d.length-1]:""}

async function eSave(){
  readForm();
  if(!D.compte){toast("Renseignez d'abord le nom du compte.");$("#d-compte").focus();return}
  const date=$("#e-date").value;if(!date){toast("Indiquez la date de l'échange.");$("#e-date").focus();return}
  const v=id=>$(id).value.trim(),t=$("#e-type").value,res=$("#e-res").value;
  const x={date,type:t,resultat:res,interlocuteur:v("#e-who"),objet:v("#e-obj"),details:v("#e-det"),suite:v("#e-suite"),relance:$("#e-rel").value};
  const acc=isRdv(t)?v("#e-acc"):"";
  const ref=$("#e-id").value;let id=uid();
  if(ref){const [k,...r]=ref.split(":");id=r.join(":");if(k==="v")D.visites=D.visites.filter(z=>z.id!==id);else D.echanges=D.echanges.filter(z=>z.id!==id)}
  if(t==="visite")D.visites.push({id,date,statut:res,accompagnant:acc,cr:x.details,suite:x.suite,relance:x.relance,interlocuteur:x.interlocuteur,objet:x.objet});
  else D.echanges.push(Object.assign({id},x,acc?{accompagnant:acc}:{}));
  if(!/^Annul/.test(res)&&(x.suite||x.relance)){D.prochaineLibelle=x.suite||"Relancer";if(x.relance)D.prochaineAction=x.relance}
  if(D.opp.creee&&!D.opp.date)D.opp.date=todayISO();
  autoStage(D);delete D.exemple;
  if(!(await saveCible(clone(D))))return;
  const wasNew=isNew;isNew=false;E_RESET=true;drawDrawer();
  toast((ref?"Échange mis à jour":"Ajouté au suivi")+(wasNew?" · fiche créée":" · fiche enregistrée"));
}

function readForm(){
  const c=D;
  document.querySelectorAll("#dForm [data-k]").forEach(i=>{c[i.dataset.k]=i.value.trim?i.value.trim():i.value});
  c.potentiel=c.potentiel===""?"":Number(c.potentiel);
  c.bu=[...document.querySelectorAll('#dForm input[data-arr="bu"]:checked')].map(i=>i.value);
  c.prestations=[...document.querySelectorAll('#dForm input[data-arr="prestations"]:checked')].map(i=>i.value);
  const oc=$("#o-creee");if(oc){c.opp.creee=oc.checked;c.opp.montant=$("#o-montant").value===""?"":Number($("#o-montant").value);c.opp.statut=$("#o-statut").value;c.opp.devis=$("#o-devis").value.trim();c.opp.date=$("#o-date").value}
}
function autoStage(c){
  if(c.etape==="sans_suite"||c.etape==="gagne")return;
  let t=SIDX[c.etape];
  if(c.visites.some(v=>v.statut==="Planifiée"))t=Math.max(t,SIDX.rdv);
  if(c.visites.some(v=>v.statut==="Réalisée"))t=Math.max(t,SIDX.visite);
  if(c.opp.creee)t=Math.max(t,SIDX.opportunite);
  if(c.opp.creee&&c.opp.statut==="Conclue")t=SIDX.gagne;
  c.etape=STAGES[t].k;
}

async function doSave(){
  readForm();
  if(!D.compte){toast("Renseignez le nom du compte.");$("#d-compte").focus();return}
  if(D.opp.creee&&!D.opp.date)D.opp.date=todayISO();
  autoStage(D);
  if(D.etape==="sans_suite"&&!D.motif){drawDrawer();toast("Choisissez un motif sans suite.");return}
  delete D.exemple;
  const c=clone(D);
  const ok=await saveCible(c);
  if(ok){toast(isNew?"Cible créée":"Cible enregistrée");closeDrawer()}
}

/* ---------- Doublons : même client dans le même département ---------- */
let DUP=null,UNDO=null;
const pl=(n,s,p)=>n+" "+(n>1?(p||s+"s"):s);
const dupKey=c=>{if(c.exemple)return "";const k=nh(c.compte);return k?k+"|"+(c.dept||""):""};
const STAGE_RANK={a_qualifier:0,cible:1,rdv:2,sans_suite:2,visite:3,opportunite:4,gagne:5};
const TYPE_RANK={"Client existant":3,"Prescripteur":2,"Prospect":1};
function dupScore(c){
  let n=0;["contact","fonction","tel","mail","segment","agence","apporteur","accompagnant","prochaineAction","prochaineLibelle","notes","potentiel"].forEach(k=>{if(c[k])n++});
  return (c.opp&&c.opp.creee?1e6:0)+c.visites.length*1e4+c.echanges.length*1e3+(STAGE_RANK[c.etape]||0)*100+n+c.bu.length+c.prestations.length}
const dupSig=g=>dupKey(g[0])+"#"+g.map(c=>c.id).sort().join(",");
function dupGroups(){
  const m={};S.cibles.forEach(c=>{const k=dupKey(c);if(k)(m[k]=m[k]||[]).push(c)});
  return Object.values(m).filter(g=>g.length>1)
    .map(g=>g.slice().sort((a,b)=>dupScore(b)-dupScore(a)||String(b.majLe||b.creeLe||"").localeCompare(String(a.majLe||a.creeLe||""))))
    .sort((a,b)=>a[0].compte.localeCompare(b[0].compte,"fr"))}
const dupIgnored=g=>(S.settings.dupIgnore||[]).includes(dupSig(g));
/* Fusion : la première fiche du groupe est conservée et complétée par les autres */
function mergeGroup(g){
  const m=clone(g[0]),rest=g.slice(1);
  ["contact","fonction","tel","mail","segment","agence","apporteur","accompagnant","source","campagne","motif"].forEach(k=>{if(!m[k]){const o=rest.find(x=>x[k]);if(o)m[k]=o[k]}});
  if(!m.prochaineAction&&!m.prochaineLibelle){const o=rest.find(x=>x.prochaineAction||x.prochaineLibelle);if(o){m.prochaineAction=o.prochaineAction||"";m.prochaineLibelle=o.prochaineLibelle||""}}
  g.forEach(x=>{
    if((TYPE_RANK[x.type]||0)>(TYPE_RANK[m.type]||0))m.type=x.type;
    if(x.priorite&&(!m.priorite||x.priorite<m.priorite))m.priorite=x.priorite;
    if((Number(x.potentiel)||0)>(Number(m.potentiel)||0))m.potentiel=x.potentiel});
  m.bu=[...new Set(g.flatMap(x=>x.bu))];
  m.prestations=PRESTA.map(p=>p[0]).filter(p=>g.some(x=>x.prestations.includes(p))).concat([...new Set(g.flatMap(x=>x.prestations))].filter(p=>!PLABEL[p]));
  let notes=[];g.forEach(x=>{const t=String(x.notes||"").trim();if(!t||notes.some(n=>n.includes(t)))return;notes=notes.filter(n=>!t.includes(n));notes.push(t)});
  m.notes=notes.join("\n");
  const seen=new Set();m.visites=[];
  g.forEach(x=>x.visites.forEach(v=>{const k2=[v.date,v.statut,v.cr].join("|");if((v.id&&seen.has(v.id))||seen.has(k2))return;if(v.id)seen.add(v.id);seen.add(k2);m.visites.push(clone(v))}));
  m.leadIds=[...new Set(g.flatMap(x=>x.leadIds||[]))];
  const seenE=new Set();m.echanges=[];
  g.forEach(x=>(x.echanges||[]).forEach(e=>{const k2=[e.date,e.type,e.resultat,e.details].join("|");if((e.id&&seenE.has(e.id))||seenE.has(k2))return;if(e.id)seenE.add(e.id);seenE.add(k2);m.echanges.push(clone(e))}));
  if(!(m.opp&&m.opp.creee)){const o=rest.find(x=>x.opp&&x.opp.creee);if(o)m.opp=clone(o.opp)}
  const cr=g.map(x=>x.creeLe).filter(Boolean).sort()[0];if(cr)m.creeLe=cr;
  delete m.copieDe;
  const r=norm(m);autoStage(r);return r}
/* Enregistrement groupé : un seul rendu en mode local */
async function bulkApply(saves,dels){
  if(S.mode==="db"){for(const c of saves){if(!(await saveCible(c)))return false}for(const id of dels){if(!(await deleteCible(id)))return false}return true}
  const now=new Date().toISOString(),del=new Set(dels);
  S.cibles=S.cibles.filter(x=>!del.has(x.id));
  saves.forEach(c=>{c.majLe=now;const i=S.cibles.findIndex(x=>x.id===c.id);if(i>=0)S.cibles[i]=c;else S.cibles.push(c)});
  lsSave();render();return true}

  const g=dupGroups().filter(x=>!dupIgnored(x)),extra=g.reduce((s,x)=>s+x.length-1,0);

   '<div class="cpl">'+groups.map((g,i)=>'<label class="dupg"><input type="checkbox" data-dg="'+i+'"'+(dupIgnored(g)?'':' checked')+'><span class="grow"><b>'+esc(g[0].compte)+'</b>'+(g[0].dept?' <span class="ty">'+esc(g[0].dept)+'</span>':'')+' <span class="sub">'+pl(g.length,"fiche")+'</span>'+g.map(row).join("")+'</span></label>').join("")+'</div>'
   :'<p class="hint">Aucun client n\'apparaît deux fois dans le même département. Un même client suivi dans deux départements n\'est pas un doublon.</p>')+

  (groups.length?'<div class="df"><span class="grow"></span><button class="btn" type="button" data-act="close">Annuler</button><button class="btn primary" type="button" data-act="dupgo" id="dupGo">Fusionner</button></div>':'');
  $("#scrim").hidden=false;d.hidden=false;dupCount();

function dupCount(){
  if(!DUP)return;const sel=[...document.querySelectorAll("#drawer input[data-dg]:checked")].map(i=>DUP[+i.dataset.dg]);
  const extra=sel.reduce((s,g)=>s+g.length-1,0),after=S.cibles.length-extra;
  const sum=$("#dupSum");if(sum)sum.innerHTML='<div><b>'+sel.length+'</b><span class="sub">client'+(sel.length>1?'s':'')+' à fusionner</span></div><div><b>'+extra+'</b><span class="sub">fiche'+(extra>1?'s':'')+' en trop</span></div><div><b>'+after+'</b><span class="sub">fiche'+(after>1?'s':'')+' après fusion</span></div>';
  const b=$("#dupGo");if(b){b.disabled=!extra;b.textContent=extra?"Fusionner "+pl(extra,"doublon"):"Fusionner"}
}
async function dupGo(){
  if(!DUP)return;const boxes=[...document.querySelectorAll("#drawer input[data-dg]")];
  const sel=boxes.filter(i=>i.checked).map(i=>DUP[+i.dataset.dg]);
  if(!sel.length){toast("Cochez au moins un client.");return}
  const btn=$("#dupGo");btn.disabled=true;btn.textContent="Fusion en cours…";
  const before=[],saves=[],dels=[];
  sel.forEach(g=>{g.forEach(c=>before.push(clone(c)));saves.push(mergeGroup(g));g.slice(1).forEach(c=>dels.push(c.id))});
  const keepIgn=boxes.filter(i=>!i.checked).map(i=>dupSig(DUP[+i.dataset.dg]));
  if(!(await bulkApply(saves,dels))){btn.disabled=false;dupCount();return}
  dels.forEach(id=>S.open.delete(id));
  S.settings.dupIgnore=keepIgn;await saveSettings();
  UNDO={before,n:dels.length};DUP=null;closeDrawer();render();
  toast(pl(dels.length,"doublon")+" fusionné"+(dels.length>1?"s":""));
}
async function dupUndo(){
  if(!UNDO)return;const u=UNDO;UNDO=null;
  const ok=await bulkApply(u.before,[]);render();
  toast(ok?"Fusion annulée : "+pl(u.n,"fiche")+" rétablie"+(u.n>1?"s":""):"Annulation impossible pour le moment.");
}

/* Import d'une liste : en-têtes cherchés dans les premières lignes, un contact = un client + une adresse */
const MALIAS={client:["client tiers","client","tiers","compte","societe","raison sociale","entreprise"],typologie:["typologie","type de client"],famille:["famille"],
  contact:["contact","contact principal","interlocuteur"],prenom:["prenom"],nom:["nom","nom de famille"],
  mail:["e mail","email","mail","courriel","adresse mail","adresse e mail","e mail contact principal","e mail contact","mail contact"],
  appel:["formule d appel"],accroche:["accroche"],mission:["derniere mission facturee","derniere mission devis","derniere mission"],
  agence:["agence principale","agence"],apporteur:["apporteur principal","apporteur"],nbFact:["nb factures","nb factures 2025","nb factures 2026"],
  ca:["ca ht 2026","ca ht facture 2025","ca ht facture 2026","ca ht","ca"],attention:["point d attention"],envoyer:["envoyer"],statut:["statut"],
  envoye:["envoye","mail envoye"],dateEnvoi:["date d envoi","envoye le"],relance:["date de relance","relance le","relance"],commentaire:["commentaire","commentaires"],liste:["liste"]};
const MIDX={};Object.entries(MALIAS).forEach(([k,a])=>a.forEach(x=>{if(!MIDX[x])MIDX[x]=k}));
function mParseSheet(rows,listeName){
  let h=-1,map=null;
  for(let i=0;i<Math.min(rows.length,12);i++){const mp=Array.from(rows[i],v=>MIDX[nh(cellVal(v))]||null);if(mp.includes("client")&&mp.includes("mail")){h=i;map=mp;break}}
  if(h<0)return null;
  const recs=[];let withMail=0,mailCells=0;
  for(let r=h+1;r<rows.length;r++){const row=rows[r],o={};
    map.forEach((k,i)=>{if(!k)return;let v=cellVal(row[i]);if(v==null||v==="")return;
      if(k==="mail"){v=String(v).trim();mailCells++;if(!v.includes("@")||o.mail)return}
      if(o[k]==null||o[k]==="")o[k]=v});
    if(!o.client&&!o.mail)continue;
    const s=k=>o[k]==null?"":String(o[k] instanceof Date?toISO(o[k]):o[k]).trim();
    const m=mnorm({liste:s("liste")||listeName,client:s("client"),typologie:s("typologie"),famille:s("famille"),contact:s("contact")||[s("prenom"),s("nom")].filter(Boolean).join(" "),mail:s("mail"),
      appel:s("appel"),accroche:s("accroche"),mission:s("mission"),agence:s("agence"),apporteur:s("apporteur"),nbFact:s("nbFact"),ca:s("ca"),attention:s("attention"),envoyer:s("envoyer"),
      commentaire:s("commentaire")||s("statut"),dateEnvoi:toISO(o.dateEnvoi),relance:toISO(o.relance)});
    if(o.envoye!=null&&/^(oui|x|1|vrai|true|envoy)/i.test(String(o.envoye).trim()))m.envoye=true;if(m.dateEnvoi)m.envoye=true;
    if(m.mail)withMail++;recs.push(m)}
  return {recs,withMail,hasEnvoyer:map.includes("envoyer")};
}
function mParseTypes(rows){
  for(let i=0;i<Math.min(rows.length,12);i++){const hd=Array.from(rows[i],v=>nh(cellVal(v)));const fi=hd.indexOf("famille"),oi=hd.indexOf("objet"),ci=hd.findIndex(x=>x==="corps du mail"||x==="corps"),ti=hd.findIndex(x=>x.startsWith("typologies"));
    if(fi<0||oi<0||ci<0)continue;const out=[];
    for(let r=i+1;r<rows.length;r++){const g=k=>{const v=cellVal(rows[r][k]);return v==null?"":String(v)};if(!g(fi)||!g(ci))continue;
      out.push({famille:g(fi).trim(),typos:ti>=0?g(ti).split(/[;,]/).map(x=>x.trim()).filter(Boolean):[],objet:g(oi).trim(),corps:g(ci)})}
    return out.length?out:null}
  return null}

async function restore(text){
  try{const j=JSON.parse(text);if(!j||!Array.isArray(j.cibles))throw 0;
    const list=j.cibles.map(x=>Object.assign(norm(x),{id:x.id||uid()}));
    if(j.settings&&S.mode!=="db"){S.settings=Object.assign({objectif:8},j.settings)}
    /* Une fiche de la sauvegarde qui n'existe pas ici mais dont le client existe déjà dans le même département est fusionnée, pas ajoutée en double */
    const byId=new Set(S.cibles.map(c=>c.id)),byKey={};S.cibles.forEach(c=>{const k=dupKey(c);if(k&&!byKey[k])byKey[k]=c});
    const saves=[];let n=0,nm=0;
    for(const c of list){const k=dupKey(c);
      if(byId.has(c.id)){saves.push(c);n++;if(k&&(!byKey[k]||byKey[k].id===c.id))byKey[k]=c;continue}
      const ex=k&&byKey[k];
      if(ex){const m=Object.assign(mergeGroup([ex,c].sort((a,b)=>dupScore(b)-dupScore(a))),{id:ex.id});byKey[k]=m;saves.push(m);nm++;continue}
      saves.push(c);byId.add(c.id);if(k)byKey[k]=c;n++}
    await bulkApply(saves,[]);
    let np=0;if(Array.isArray(j.pac))for(const x of j.pac){if(await savePac(Object.assign(pnorm(x),{id:x.id||uid()})))np++}
    let nml=0;if(Array.isArray(j.mailing)){const bi=new Map(S.mailing.map(m=>[m.id,m])),bk=new Map(S.mailing.map(m=>[mkey(m),m]));
      const l=j.mailing.map(x=>{const m=mnorm(x),ex=bi.get(m.id)||bk.get(mkey(m));m.id=ex?ex.id:(m.id||uid());return m});if(await mBulk(l))nml=l.length}
    if(S.mode!=="db")lsSave();
    toast(pl(n,"cible")+" restaurée"+(n>1?"s":"")+(nm?" · "+nm+" fusionnée"+(nm>1?"s":"")+" avec une fiche existante":"")+(np?" · "+pl(np,"ligne")+" de PAC":"")+(nml?" · "+pl(nml,"contact")+" de mailing":""));closeDrawer();render();if(S.tab==="mailing")renderMailing()}
  catch(e){toast("Sauvegarde illisible : collez le texte exporté par cette application, en entier.")}
}

   ["BU d'origine et Diagnostics visés : plusieurs valeurs possibles, séparées par des virgules (ex. Amiante, Plomb, DPE).",{}],
   ["Diagnostics reconnus : Amiante, Plomb, DPE / audit énergétique, Gaz, Électricité, Termites, PEMD, Avant vente / relocation.",{}],
   ["Priorité : A, B ou C. Vide = B.   Étape : vide = À qualifier.",{}],
   ["Prochaine action : une date au format jj/mm/aaaa.",{}],["",{}],
   ["Dans l'application : Importer, choisir ce fichier, vérifier l'aperçu puis valider.",{bold:true}],
   ["Une entreprise déjà présente est complétée avec les informations du fichier : ses visites et son historique sont conservés.",{}]];
  lines.forEach(([t,f],i)=>{const c=g.getCell("B"+(i+2));c.value=t;c.font=Object.assign({name:"Calibri",size:11},f);c.alignment={wrapText:true}});
  const buf=await wb.xlsx.writeBuffer();return new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}

/* ---------- Événements ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,tr[data-id],tr[data-pid]");if(!t)return;
  if(t.dataset.tab){showTab(t.dataset.tab);return}
  if(t.dataset.view){S.view=t.dataset.view;render();return}
  if(t.dataset.tog){toggleRow(t.dataset.tog);return}
  if(t.dataset.togall){const ids=[...document.querySelectorAll("#listWrap tr[data-id]")].map(r=>r.dataset.id);const ao=ids.every(id=>S.open.has(id));
    ids.forEach(id=>ao?S.open.delete(id):S.open.add(id));renderList();const b=$("#listWrap [data-togall]");if(b)b.focus();return}
  if(t.dataset.open){openDrawer(t.dataset.open);return}
  if(t.matches("tr[data-id]")){openDrawer(t.dataset.id);return}
  if(t.id==="btnNew"||t.dataset.act==="new"){openDrawer(null);return}
  if(t.id==="btnExport"){exportMenu();return}
  if(t.id==="btnImport"){importMenu();return}
  if(t.id==="btnDelEx"){
    if(!t.classList.contains("armed")){t.classList.add("armed","danger");t.textContent="Confirmer la suppression des exemples";return}
    for(const c of S.cibles.filter(c=>c.exemple))await deleteCible(c.id);toast("Exemples supprimés");return}
  if(t.dataset.act==="close"){CP=null;PIMP=null;DUP=null;MIMP=null;closeDrawer();return}
  /* Mailing */
  if(t.dataset.mview){MUI.view=t.dataset.mview;MUI.lim=200;renderMKpis();renderMList();return}
  if(t.dataset.act==="mimport"){mImportMenu();return}
  if(t.dataset.act==="mimpgo"){await mImportGo();return}
  if(t.dataset.act==="mcopy"){await mCopyAddresses();return}
  if(t.dataset.act==="mmark"){await mMarkCopied();return}
  if(t.dataset.act==="mnoteclose"){MUI.copied=null;MUI.showCopy="";renderMNote();return}
  if(t.dataset.act==="mmore"){MUI.lim+=200;renderMList();return}
  if(t.dataset.act==="mexport"){exportMenu();return}
  if(t.dataset.mcp!=null){const m=mById(t.closest("tr[data-mid]")),tp=m&&mTpl(m);if(!tp)return;
    try{await navigator.clipboard.writeText(tp.corps);toast("Texte du mail copié · objet : "+tp.objet)}catch(e){toast("Copie bloquée ici : utilisez le bouton Mail.")}return}
  if(t.dataset.act==="dupmenu"){dupMenu();return}
  if(t.dataset.act==="dupgo"){await dupGo();return}
  if(t.dataset.act==="dupundo"){await dupUndo();return}
  if(t.dataset.act==="dupok"){UNDO=null;render();return}
  /* PAC */
  if(t.matches("tr[data-pid]")){openPac(t.dataset.pid);return}
  if(t.dataset.pprio){if(!S.writable)return;const p=S.pac.find(x=>x.id===t.dataset.pprio);if(!p)return;const c=clone(p);const seq=["1","2","3",""];c.prio=seq[(seq.indexOf(c.prio)+1)%4];
    if(await savePac(c))toast((c.prio?"Priorité "+prioLbl(c.prio):"Priorité retirée")+" — "+c.element);return}
  if(t.dataset.pf!=null&&t.matches(".chip")){PUI.f=t.dataset.pf;puiSave();renderPac();return}
  if(t.dataset.pdq){if(!S.writable)return;const p=S.pac.find(x=>x.id===t.dataset.pdq);if(!p)return;const c=clone(p);c.decision=c.decision===t.dataset.d?"":t.dataset.d;
    if(await savePac(c))toast(c.decision?"Décision : "+c.decision.toLowerCase()+" — "+c.element:"Décision retirée");return}
  if(t.dataset.act==="pnew"){openPac(null);return}
  if(t.dataset.act==="pexport"){exportMenu();return}
  if(t.dataset.act==="pprint"){pacPrint();return}
  if(t.dataset.act==="phead"){pacHeadMenu();return}
  if(t.dataset.act==="pheadsave"){S.settings.pacTitre=$("#ph-t").value.trim();S.settings.pacPeriode=$("#ph-p").value.trim();await saveSettings();closeDrawer();renderPac();toast("En-tête du PAC enregistré");return}
  if(t.dataset.act==="pfromcamps"){await pacFromCamps();return}
  if(t.dataset.act==="pimport"){pacImportMenu();return}
  if(t.dataset.act==="pmod"){pacModelesMenu();return}
  if(t.dataset.act==="pmgo"){const sel=[...document.querySelectorAll("#drawer input[data-pm]:checked")].map(i=>PAC_MODELES[+i.dataset.pm]);
    if(!sel.length){toast("Cochez au moins une ligne.");return}const n=await pacAddModeles(sel);closeDrawer();toast(n?n+" ligne"+(n>1?"s":"")+" ajoutée"+(n>1?"s":"")+" au PAC":"Ces lignes sont déjà dans le PAC");return}
  if(t.dataset.act==="pimpgo"){await pacImportGo();return}
  if(P){
    if(t.dataset.ppr){pReadForm();P.prio=P.prio===t.dataset.ppr?"":t.dataset.ppr;drawPac();return}
    if(t.dataset.pdec){pReadForm();P.decision=P.decision===t.dataset.pdec?"":t.dataset.pdec;drawPac();return}
    if(t.dataset.act==="psave"){pReadForm();if(!P.element){toast("Renseignez l'élément de la ligne.");$("#p-element").focus();return}
      if(await savePac(clone(P))){toast(pIsNew?"Ligne ajoutée au PAC":"Ligne enregistrée");closeDrawer()}return}
    if(t.dataset.act==="pdel"){if(!pDelArmed){pDelArmed=true;t.classList.add("armed");t.textContent="Confirmer la suppression";return}
      if(await deletePac(P.id)){toast("Ligne supprimée du PAC");closeDrawer()}return}
    if(t.dataset.act==="pup"||t.dataset.act==="pdown"){await pacMove(t.dataset.act==="pup"?-1:1);return}
    return}
  if(t.dataset.copy){let src=null;if(D&&D.id===t.dataset.copy){readForm();if(!D.compte){toast("Renseignez d'abord le nom du compte.");return}autoStage(D);delete D.exemple;src=clone(D);if(!(await saveCible(clone(D))))return;closeDrawer()}else src=S.cibles.find(x=>x.id===t.dataset.copy);
    if(src){if(!src.compte){toast("Renseignez d'abord le nom du compte.");return}copyMenu(src)}return}
  if(t.dataset.act==="docopy"){doCopy();return}
  if(!D)return;
  if(t.dataset.prio){readForm();D.priorite=t.dataset.prio;drawDrawer();return}
  if(t.dataset.type){readForm();D.type=t.dataset.type;drawDrawer();return}
  if(t.dataset.stage){readForm();D.etape=t.dataset.stage;drawDrawer();return}
  if(t.dataset.act==="save"){doSave();return}
  if(t.dataset.act==="del"){
    if(!delArmed){delArmed=true;t.classList.add("armed");t.textContent="Confirmer la suppression";return}
    if(await deleteCible(D.id)){toast("Cible supprimée");closeDrawer()}return}
  /* Suivi des échanges */
  if(t.dataset.etf!=null){ETF=t.dataset.etf;drawTimeline();return}
  if(t.dataset.act==="adde"){t.disabled=true;try{await eSave()}finally{t.disabled=false}return}
  if(t.dataset.eedit){const [k,...r]=t.dataset.eedit.split(":"),id=r.join(":");const x=timeline(D).find(z=>z.k===k&&String(z.id)===id);if(!x)return;
    $("#e-date").value=x.date||"";$("#e-type").value=x.type;eSync();if([...$("#e-res").options].some(o=>o.value===x.resultat))$("#e-res").value=x.resultat;
    $("#e-who").value=x.interlocuteur||"";$("#e-obj").value=x.objet||"";$("#e-acc").value=x.accompagnant||"";$("#e-det").value=x.details||"";$("#e-suite").value=x.suite||"";$("#e-rel").value=x.relance||"";
    $("#e-id").value=k+":"+id;eEditMode(true);$("#eForm").scrollIntoView({block:"nearest",behavior:"smooth"});$("#e-det").focus({preventScroll:true});return}
  if(t.dataset.act==="cancele"){readForm();E_RESET=true;drawDrawer();return}
  if(t.dataset.act==="dele"){
    if(!t.classList.contains("armed")){t.classList.add("armed");t.textContent="Confirmer la suppression";return}
    readForm();const ref=$("#e-id").value;if(!ref)return;const [k,...r]=ref.split(":"),id=r.join(":");
    if(k==="v")D.visites=D.visites.filter(z=>String(z.id)!==id);else D.echanges=D.echanges.filter(z=>String(z.id)!==id);
    if(!(await saveCible(clone(D))))return;isNew=false;E_RESET=true;drawDrawer();toast("Échange supprimé · fiche enregistrée");return}
});
document.addEventListener("change",e=>{
  if(e.target.id==="o-creee"){$("#oFields").hidden=!e.target.checked}
  if(e.target.id==="e-type")eSync();
  if(e.target.id==="e-date"&&isRdv($("#e-type").value)&&$("#e-res").value!=="Annulée")$("#e-res").value=e.target.value>todayISO()?"Planifiée":"Réalisée";
  if(e.target.matches("#drawer input[data-dg]"))dupCount();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("#drawer").hidden){if(D||P){stayOpen();return}closeDrawer();return}
  if(e.key==="Enter"&&e.target.matches("tr[data-id]"))openDrawer(e.target.dataset.id);
  if(e.key==="Enter"&&e.target.matches("tr[data-pid]"))openPac(e.target.dataset.pid);
  if((e.key==="ArrowRight"||e.key==="ArrowLeft")&&e.target.matches("tr[data-id]")){e.preventDefault();toggleRow(e.target.dataset.id,e.key==="ArrowRight")}
});
/* Un clic à côté du panneau ne le ferme plus : seuls Enregistrer et Fermer le font */
function stayOpen(){toast(D?"La fiche reste ouverte : Enregistrer, ou Fermer.":"Pour quitter ce panneau : Fermer.");
  const b=document.querySelector("#drawer .df .btn.primary")||document.querySelector('#drawer [data-act="close"]');if(b){b.classList.remove("nudge");void b.offsetWidth;b.classList.add("nudge")}}
$("#scrim").addEventListener("click",stayOpen);
["#q","#fBu","#fAg","#fPr","#fTy","#fDp","#fCa","#fSort"].forEach(s=>$(s).addEventListener("input",renderList));

handoffMode().then(h=>{if(!h)init()});
})();
</script>
